      data:
        group: light.lights_hall_all
        members: [light.hallbulb1, light.hallbulb2, light.hallbulb3, light.hallshoesled]
        fallback_members: [light.hallbulb1, light.hallbulb2, light.hallbulb3, light.hallshoesled]
        fallback_brightness_pct: 100

voice_hall_lights_off:
  alias: "Voice: Hall lights off"
  mode: restart
  sequence:
    - action: script.voice_group_off
      data:
        group: light.lights_hall_all
        members: [light.hallbulb1, light.hallbulb2, light.hallbulb3, light.hallshoesled]
        fallback_members: [light.hallbulb1, light.hallbulb2, light.hallbulb3, light.hallshoesled]

voice_bedroom_lights_on:
  alias: "Voice: Bedroom lights on"
  mode: restart
  sequence:
    - if: "{{ is_state('switch.bedroomdimmer_relay', 'off') }}"
      then:
        - action: switch.turn_on
          target: {entity_id: switch.bedroomdimmer_relay}
        - wait_template: "{{ is_state('switch.bedroomdimmer_relay', 'on') }}"
          timeout: "00:00:15"
          continue_on_timeout: true
    - wait_template: "{{ states('light.bedroom_lights') not in ['unknown', 'unavailable'] }}"
      timeout: "00:00:20"
      continue_on_timeout: true
    - action: script.voice_group_on
      data:
        group: light.bedroom_lights
        members: [light.bedroombulb1, light.bedroombulb2, light.bedroombulb3]
        fallback_members: [light.bedroombulb1, light.bedroombulb2, light.bedroombulb3]

voice_bedroom_lights_off:
  alias: "Voice: Bedroom lights off"
  mode: restart
  sequence:
    - action: switch.turn_off
      target: {entity_id: switch.bedroomdimmer_relay}

voice_workroom_main_on:
  alias: "Voice: Work Room main light on"
  mode: restart
  sequence:
    - action: light.turn_on
      target: {entity_id: light.workroomledmaindimmer}

voice_workroom_main_off:
  alias: "Voice: Work Room main light off"
  mode: restart
  sequence:
    - action: light.turn_off
      target: {entity_id: light.workroomledmaindimmer}

voice_workroom_table_on:
  alias: "Voice: Work Room table lights on"
  mode: restart
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.workroomswitchledstable
    - wait_template: "{{ is_state('switch.workroomswitchledstable', 'on') }}"
      timeout: "00:00:15"
      continue_on_timeout: true
    - wait_template: "{{ states('light.work_room_table_lights') not in ['unknown', 'unavailable'] }}"
      timeout: "00:00:20"
      continue_on_timeout: true
    - action: script.voice_group_on
      data:
        group: light.work_room_table_lights
        members: [light.workroomtableleftdimmer, light.workroomtablerightdimmer]
        fallback_members: [light.workroomtableleftdimmer, light.workroomtablerightdimmer]

voice_workroom_table_off:
  alias: "Voice: Work Room table lights off"
  mode: restart
  sequence:
    - action: switch.turn_off
      target: {entity_id: switch.workroomswitchledstable}

voice_workroom_lights_on:
  alias: "Voice: Work Room lights on"
  mode: restart
  sequence:
    - action: script.voice_workroom_main_on
    - action: script.voice_workroom_table_on

voice_workroom_lights_off:
  alias: "Voice: Work Room lights off"
  mode: restart
  sequence:
    - action: script.voice_workroom_main_off
    - action: script.voice_workroom_table_off

voice_livingroom_lights_on:
  alias: "Voice: Living Room lights on"
  mode: restart
  sequence:
    # Living room lights = ALL Living Room lighting INCLUDING Circle (#3 correction 5381189810)
    - action: script.voice_group_on
      data:
        group: light.lr_kitchenbulbsandliner
        members: [light.livingroombulbtableleft, light.livingroombulbtablemiddle, light.livingroombulbtableright, light.livingroomlineardimmer]
        fallback_members: [light.livingroombulbtableleft, light.livingroombulbtablemiddle, light.livingroombulbtableright, light.livingroomlineardimmer]
    - action: script.voice_circle_light_on

voice_livingroom_lights_off:
  alias: "Voice: Living Room lights off"
  mode: restart
  sequence:
    # Living room lights = ALL Living Room lighting INCLUDING Circle (#3 correction 5381189810)
    - action: script.voice_group_off
      data:
        group: light.lr_kitchenbulbsandliner
        members: [light.livingroombulbtableleft, light.livingroombulbtablemiddle, light.livingroombulbtableright, light.livingroomlineardimmer]
        fallback_members: [light.livingroombulbtableleft, light.livingroombulbtablemiddle, light.livingroombulbtableright, light.livingroomlineardimmer]
    - action: script.voice_circle_light_off

voice_circle_light_on:
  alias: "Voice: Circle light on"
  mode: restart
  sequence:
    - action: light.turn_on
      target: {entity_id: light.livingroomcirclelightdimmer}
    - wait_template: "{{ is_state('light.livingroomcirclelightdimmer', 'on') }}"
      timeout: "00:00:10"
      continue_on_timeout: true
    - if: "{{ not is_state('light.livingroomcirclelightdimmer', 'on') }}"
      then:
        - action: system_log.write
          data:
            level: error
            message: "Voice circle light ON failed: smart dimmer did not reach ON."

voice_circle_light_off:
  alias: "Voice: Circle light off"
  mode: restart
  sequence:
    - action: light.turn_off
      target: {entity_id: light.livingroomcirclelightdimmer}
    - wait_template: "{{ is_state('light.livingroomcirclelightdimmer', 'off') }}"
      timeout: "00:00:10"
      continue_on_timeout: true
    - if: "{{ not is_state('light.livingroomcirclelightdimmer', 'off') }}"
      then:
        - action: system_log.write
          data:
            level: error
            message: "Voice circle light OFF failed: smart dimmer did not reach OFF."

voice_bathroom_on:
  alias: "Voice: Bathroom light on"
  mode: restart
  sequence:
    - action: switch.turn_on
      target: {entity_id: switch.bathroomswitchrouter}

voice_bathroom_off:
  alias: "Voice: Bathroom light off"
  mode: restart
  sequence:
    - action: switch.turn_off
      target: {entity_id: switch.bathroomswitchrouter}

voice_restroom_on:
  alias: "Voice: Restroom light on"
  mode: restart
  sequence:
    - action: switch.turn_on
      target: {entity_id: switch.restroomswitch}

voice_restroom_off:
  alias: "Voice: Restroom light off"
  mode: restart
  sequence:
    - action: switch.turn_off
      target: {entity_id: switch.restroomswitch}

voice_all_lights_on:
  alias: "Voice: All lights on"
  mode: restart
  sequence:
    # Circle is included via voice_livingroom_lights_on (no separate call — avoids double actuation)
    - action: script.voice_hall_lights_on
    - action: script.voice_livingroom_lights_on
    - action: script.voice_bedroom_lights_on
    - action: script.voice_workroom_lights_on
    - action: script.voice_bathroom_on
    - action: script.voice_restroom_on

voice_all_lights_off:
  alias: "Voice: All lights off"
  mode: restart
  sequence:
    # Circle is included via voice_livingroom_lights_off (no separate call — avoids double actuation)
    - action: script.voice_hall_lights_off
    - action: script.voice_livingroom_lights_off
    - action: script.voice_bedroom_lights_off
    - action: script.voice_workroom_lights_off
    - action: script.voice_bathroom_off
    - action: script.voice_restroom_off


main_dimmer_finalize_v5_indicators:
  alias: "MainDimmer v5: Finalize accepted LED profile"
  description: >-
    Manual post-canary finalization only. LEFT and MIDDLE are permanent-power
    smart-light channels and use Binding status. RIGHT is intentionally a
    hard-power channel and uses Physical output. This script seeds the two
    tracked smart-light states before selecting their LED source. It never
    changes Mains power, device_config, bindings or groups.
  mode: single
  fields:
    operator_continuity_confirmed:
      name: Physical behavior confirmed
      description: >-
        Enable only after the operator has verified that LEFT and MIDDLE remain
        continuously powered through button tests and that RIGHT intentionally
        cuts/restores the Circle-dimmer mains exactly once with its logical
        state.
      required: true
      selector:
        boolean:
  sequence:
    - condition: template
      value_template: >-
        {{ operator_continuity_confirmed | default(false) | bool }}
    - condition: template
      alias: Accepted mains-power profile is already active
      value_template: >-
        {{
          states('select.livingroommaindimmer_relay_left_physical_mode') == 'Always on'
          and states('select.livingroommaindimmer_relay_middle_physical_mode') == 'Always on'
          and states('select.livingroommaindimmer_relay_right_physical_mode') == 'Follow logical state'
        }}
    - condition: template
      alias: Required v5 LED choices are available
      value_template: >-
        {{
          'Binding status' in (state_attr('select.livingroommaindimmer_relay_left_indicator_mode', 'options') | default([], true))
          and 'Binding status' in (state_attr('select.livingroommaindimmer_relay_middle_indicator_mode', 'options') | default([], true))
          and 'Physical output' in (state_attr('select.livingroommaindimmer_relay_right_indicator_mode', 'options') | default([], true))
        }}
    - condition: template
      alias: Real LEFT and MIDDLE target states are known
      value_template: >-
        {{
          states('light.livingroomlineardimmer') in ['on', 'off']
          and states('light.lr_kitchen_table_bulbs') in ['on', 'off']
        }}
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/LivingRoomMainDimmer/set
        payload: >-
          {
            "state_relay_left":"{{ 'ON' if is_state('light.livingroomlineardimmer', 'on') else 'OFF' }}",
            "relay_left_binding_intent":"{{ 'ON' if is_state('light.livingroomlineardimmer', 'on') else 'OFF' }}",
            "state_relay_middle":"{{ 'ON' if is_state('light.lr_kitchen_table_bulbs', 'on') else 'OFF' }}",
            "relay_middle_binding_intent":"{{ 'ON' if is_state('light.lr_kitchen_table_bulbs', 'on') else 'OFF' }}"
          }
    - delay: "00:00:02"
    - action: select.select_option
      target:
        entity_id:
          - select.livingroommaindimmer_relay_left_indicator_mode
          - select.livingroommaindimmer_relay_middle_indicator_mode
      data:
        option: Binding status
    - action: select.select_option
      target:
        entity_id: select.livingroommaindimmer_relay_right_indicator_mode
      data:
        option: Physical output
    - wait_template: >-
        {{
          states('select.livingroommaindimmer_relay_left_indicator_mode') == 'Binding status'
          and states('select.livingroommaindimmer_relay_middle_indicator_mode') == 'Binding status'
          and states('select.livingroommaindimmer_relay_right_indicator_mode') == 'Physical output'
        }}
      timeout: "00:00:30"
      continue_on_timeout: false
