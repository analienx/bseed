- id: hall_entrance_auto_off_timer
  alias: Hall Entrance - Auto-Off Countdown
  description: Starts the visible countdown using the existing automatic or manual timeout. Any entrance motion cancels it; the timer is the single source of the normal turn-off deadline.
  triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: template
    value_template: "{{ states('binary_sensor.hallpirsensorentrance_occupancy') in ['off', 'unknown', 'unavailable']\n   and states('binary_sensor.hallcabinetpir_presence') in ['off', 'unknown', 'unavailable']\n\
      \   and states('binary_sensor.hallpiradvanced_occupancy') in ['off', 'unknown', 'unavailable'] }}"
    id: clear
  - trigger: template
    value_template: "{{ not (states('binary_sensor.hallpirsensorentrance_occupancy') in ['off', 'unknown', 'unavailable']\n   and states('binary_sensor.hallcabinetpir_presence') in ['off', 'unknown', 'unavailable']\n\
      \   and states('binary_sensor.hallpiradvanced_occupancy') in ['off', 'unknown', 'unavailable']) }}"
    id: occupied
  - trigger: state
    entity_id:
    - light.hallbulb1
    - light.hallbulb2
    - light.hallshoesled
    to: 'on'
    id: light_on
  - trigger: state
    entity_id:
    - light.hallbulb1
    - light.hallbulb2
    - light.hallshoesled
    to: 'off'
    id: light_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: occupied
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.hall_entrance_auto_off
    - conditions:
      - condition: trigger
        id: light_off
      - condition: template
        value_template: '{{ not is_state(''light.hallbulb1'', ''on'') and not is_state(''light.hallbulb2'', ''on'') and not is_state(''light.hallshoesled'', ''on'') }}'
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.hall_entrance_auto_off
    - conditions:
      - condition: template
        value_template: '{{ is_state(''light.hallbulb1'', ''on'') or is_state(''light.hallbulb2'', ''on'') or is_state(''light.hallshoesled'', ''on'') }}'
      - condition: template
        value_template: "{{ states('binary_sensor.hallpirsensorentrance_occupancy') in ['off', 'unknown', 'unavailable']\n   and states('binary_sensor.hallcabinetpir_presence') in ['off', 'unknown', 'unavailable']\n\
          \   and states('binary_sensor.hallpiradvanced_occupancy') in ['off', 'unknown', 'unavailable'] }}"
      - condition: template
        value_template: '{{ not (trigger.id == ''startup'' and is_state(''timer.hall_entrance_auto_off'', ''active'')) }}'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.hall_entrance_auto_off
        data:
          duration:
            minutes: "{{ states('input_number.hall_light_timeout_min') | float(1)\n   if trigger.id == 'startup'\n   else states('input_number.hall_light_manual_timeout_min') | float(30)\n   if is_state('input_boolean.hall_entrance_manual_on_flag',\
              \ 'on')\n   else states('input_number.hall_light_timeout_min') | float(1) }}"
  mode: restart
- id: '1773866197463'
  alias: A1b - Hall Entrance - Turn OFF
  description: Turns off when the visible Hall Entrance countdown finishes. Unavailable or unknown sensors count as clear. The existing zombie failsafe still turns it off if any sensor stays ON for its
    configured timeout. Auto-off flag is held until light state confirms off to prevent a false cooldown trigger from Z2M round-trip delay.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.hall_entrance_auto_off
  - trigger: state
    entity_id: binary_sensor.hallpirsensorentrance_occupancy
    to: 'on'
    for:
      minutes: '{{ states(''input_number.hall_light_zombie_timeout_min'') | float(30) }}'
  - trigger: state
    entity_id: binary_sensor.hallcabinetpir_presence
    to: 'on'
    for:
      minutes: '{{ states(''input_number.hall_light_zombie_timeout_min'') | float(30) }}'
  - trigger: state
    entity_id: binary_sensor.hallpiradvanced_occupancy
    to: 'on'
    for:
      minutes: '{{ states(''input_number.hall_light_zombie_timeout_min'') | float(30) }}'
  conditions: []
  actions:
  - condition: template
    value_template: "{{ is_state('light.hallbulb1', 'on') or is_state('light.hallbulb2', 'on')\n   or is_state('light.hallshoesled', 'on') }}"
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hall_entrance_auto_off_flag
  - action: light.turn_off
    target:
      entity_id:
      - light.hallbulb1
      - light.hallbulb2
      - light.hallshoesled
    data:
      transition: 2
  - wait_template: "{{ (is_state('light.hallbulb1', 'off') and is_state('light.hallbulb2', 'off'))\n   and is_state('light.hallshoesled', 'off') }}"
    timeout:
      seconds: 10
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hall_entrance_auto_off_flag
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hall_entrance_manual_on_flag
  mode: single
- id: rr1_restroom_turn_on
  alias: RR1 - Restroom - Turn ON
  description: 'Sensor RestroomPIR (ZG-204Z, occupancy only). No illuminance or timing  — restroom turns on any time of day. Cooldown blocks auto-on if manually turned off within cooldown. Waits for switch
    state confirmation before clearing auto_on_flag.

    '
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/RestroomPIR
    value_template: '{{ value_json.get(''occupancy'') | string | lower }}'
    payload: 'true'
  conditions:
  - condition: state
    entity_id: input_boolean.shutdown_in_progress
    state: 'off'
  - condition: state
    entity_id: timer.restroom_manual_off_cooldown
    state: idle
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.restroom_auto_on_flag
    data: {}
  - action: switch.turn_on
    data: {}
    target:
      entity_id: switch.restroomswitch
  - wait_template: '{{ is_state(''switch.restroomswitch'', ''on'') }}'
    timeout:
      seconds: 5
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.restroom_auto_on_flag
  mode: restart
- id: rr2_restroom_turn_off
  alias: RR2 - Restroom - Turn OFF
  description: 'Turns off restroomswitch when RestroomPIR clears. Timeout extended when manually turned on. Zombie failsafe if sensor gets physically stuck ON. Auto-off flag held until switch state confirms
    off.

    '
  triggers:
  - trigger: template
    value_template: '{{ states(''binary_sensor.restroompir_occupancy'') in [''off'', ''unknown'', ''unavailable''] }}

      '
    for:
      minutes: "{{ states('input_number.restroom_light_manual_timeout_min') | float(30)\n   if is_state('input_boolean.restroom_manual_on_flag', 'on')\n   else states('input_number.restroom_light_timeout_min')\
        \ | float(5) }}\n"
  - trigger: state
    entity_id: binary_sensor.restroompir_occupancy
    to: 'on'
    for:
      minutes: '{{ states(''input_number.restroom_light_zombie_timeout_min'') | float(30) }}'
  conditions:
  - condition: state
    entity_id: switch.restroomswitch
    state: 'on'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.restroom_auto_off_flag
  - action: switch.turn_off
    target:
      entity_id: switch.restroomswitch
  - wait_template: '{{ is_state(''switch.restroomswitch'', ''off'') }}'
    timeout:
      seconds: 10
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.restroom_auto_off_flag
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.restroom_manual_on_flag
  mode: single
- id: cooldownrestroommanualoff
  alias: Cooldown - Restroom Manual Off
  description: 'Detects manual turn-off of restroom switch. If auto_off_flag is OFF when switch turns off, it was manual. Starts a long blocking timer immediately, waits for sensor to clear, then restarts
    with the short cooldown.

    '
  triggers:
  - trigger: state
    entity_id: switch.restroomswitch
    from: 'on'
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.restroom_auto_off_flag
    state: 'off'
  actions:
  - action: timer.start
    target:
      entity_id: timer.restroom_manual_off_cooldown
    data:
      duration: 300
  - wait_template: '{{ states(''binary_sensor.restroompir_occupancy'') in [''off'', ''unknown'', ''unavailable''] }}

      '
    timeout:
      seconds: 300
  - action: timer.start
    target:
      entity_id: timer.restroom_manual_off_cooldown
    data:
      duration: '{{ states(''input_number.manual_off_cooldown_sec'') | int(5) }}'
  mode: single
- id: '1774303606092'
  alias: Cooldown - Hall Shoes LED Manual Off
  description: Detects manual turn-off of hall shoes LED. If auto_off_flag is OFF when LED turns off, it was manual. Starts a long blocking timer immediately, waits for all sensors to clear, then restarts
    with the short cooldown. Independent from hall entrance bulbs cooldown.
  triggers:
  - trigger: state
    entity_id: light.hallshoesled
    from: 'on'
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.hall_entrance_auto_off_flag
    state: 'off'
  actions:
  - action: timer.start
    target:
      entity_id: timer.hall_shoesled_manual_off_cooldown
    data:
      duration: '300'
  - wait_template: "{{ states('binary_sensor.hallpirsensorentrance_occupancy') in ['off', 'unknown', 'unavailable']\n   and states('binary_sensor.hallcabinetpir_presence') in ['off', 'unknown', 'unavailable']\n\
      \   and states('binary_sensor.hallpiradvanced_occupancy') in ['off', 'unknown', 'unavailable'] }}"
    timeout:
      seconds: 300
  - action: timer.start
    target:
      entity_id: timer.hall_shoesled_manual_off_cooldown
    data:
      duration: '{{ states(''input_number.manual_off_cooldown_sec'') | int(5) }}'
  mode: single
- id: "1776711056902"
  alias: LR - MainDimmer v5 Target State Reconciliation
  description: >-
    Corrective synchronization for the two permanent-power smart-light channels
    only. LEFT and MIDDLE normally update Bound light (tracked) locally in
    firmware when their direct-binding command is accepted; Home Assistant
    corrects those trackers only when the real target later disagrees. RIGHT is
    intentionally excluded because it is a hard-power channel: its logical
    state directly controls mains and its panel LED follows Physical output.
    The automation is fail-closed until the complete accepted v5 channel profile
    is present.
  triggers:
    - trigger: state
      entity_id: light.livingroomlineardimmer
      id: left
    - trigger: state
      entity_id: light.lr_kitchen_table_bulbs
      id: middle
    - trigger: homeassistant
      event: start
      id: startup
    - trigger: state
      entity_id:
        - select.livingroommaindimmer_relay_left_physical_mode
        - select.livingroommaindimmer_relay_middle_physical_mode
        - select.livingroommaindimmer_relay_right_physical_mode
      id: policy_ready
    - trigger: state
      entity_id:
        - select.livingroommaindimmer_relay_left_indicator_mode_relay_left
        - select.livingroommaindimmer_relay_middle_indicator_mode_relay_middle
        - select.livingroommaindimmer_relay_right_indicator_mode_relay_right
      id: indicator_ready
  conditions:
    - condition: template
      alias: Accepted LEFT/MIDDLE permanent-power and RIGHT hard-power profile is active
      value_template: >-
        {{
          states('select.livingroommaindimmer_relay_left_physical_mode') == 'Always on'
          and states('select.livingroommaindimmer_relay_middle_physical_mode') == 'Always on'
          and states('select.livingroommaindimmer_relay_right_physical_mode') == 'Follow logical state'
        }}
    - condition: template
      alias: Accepted LED source profile is active
      value_template: >-
        {{
          states('select.livingroommaindimmer_relay_left_indicator_mode_relay_left') == 'Binding status'
          and states('select.livingroommaindimmer_relay_middle_indicator_mode_relay_middle') == 'Binding status'
          and states('select.livingroommaindimmer_relay_right_indicator_mode_relay_right') == 'Physical output'
        }}
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: left
            - condition: template
              value_template: "{{ trigger.to_state is not none and trigger.to_state.state in ['on', 'off'] }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/LivingRoomMainDimmer/set
                payload: >-
                  {
                    "state_relay_left":"{{ 'ON' if is_state('light.livingroomlineardimmer', 'on') else 'OFF' }}",
                    "relay_left_binding_intent":"{{ 'ON' if is_state('light.livingroomlineardimmer', 'on') else 'OFF' }}"
                  }
        - conditions:
            - condition: trigger
              id: middle
            - condition: template
              value_template: "{{ trigger.to_state is not none and trigger.to_state.state in ['on', 'off'] }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/LivingRoomMainDimmer/set
                payload: >-
                  {
                    "state_relay_middle":"{{ 'ON' if is_state('light.lr_kitchen_table_bulbs', 'on') else 'OFF' }}",
                    "relay_middle_binding_intent":"{{ 'ON' if is_state('light.lr_kitchen_table_bulbs', 'on') else 'OFF' }}"
                  }
        - conditions:
            - condition: template
              value_template: "{{ trigger.id in ['startup', 'policy_ready', 'indicator_ready'] }}"
          sequence:
            - wait_template: >-
                {{
                  states('light.livingroomlineardimmer') in ['on', 'off']
                  and states('light.lr_kitchen_table_bulbs') in ['on', 'off']
                }}
              timeout: "00:01:30"
              continue_on_timeout: false
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/LivingRoomMainDimmer/set
                payload: >-
                  {
                    "state_relay_left":"{{ 'ON' if is_state('light.livingroomlineardimmer', 'on') else 'OFF' }}",
                    "relay_left_binding_intent":"{{ 'ON' if is_state('light.livingroomlineardimmer', 'on') else 'OFF' }}",
                    "state_relay_middle":"{{ 'ON' if is_state('light.lr_kitchen_table_bulbs', 'on') else 'OFF' }}",
                    "relay_middle_binding_intent":"{{ 'ON' if is_state('light.lr_kitchen_table_bulbs', 'on') else 'OFF' }}"
                  }
  mode: queued
  max: 10
- id: '1778610265321'
  alias: Bedroom Entrance USB Button - BedroomSocketDoorR
  description: 1 short release turns socket on, 2 short release turns socket off
  triggers:
  - topic: zigbee2mqtt/buttBedroomEntranceUSB/action
    payload: 1_short_release
    id: on_press
    trigger: mqtt
  - topic: zigbee2mqtt/buttBedroomEntranceUSB/action
    payload: 2_short_release
    id: off_press
    trigger: mqtt
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: on_press
      sequence:
      - target:
          entity_id: switch.bedroomsocketdoorr
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: off_press
      sequence:
      - target:
          entity_id: switch.bedroomsocketdoorr
        action: switch.turn_off
  mode: single
- id: zigbee2mqtt_mesh_communication_outage_alert
  alias: Zigbee2MQTT - Mesh Communication Outage Alert
  description: >-
    Recovers a stalled Zigbee2MQTT session on the SONOFF Dongle-M (EmberZNet). A
    Zigbee2MQTT restart clears host-side wedges only; a stalled EFR32MG24 needs a
    reboot from its own Web Console, which cannot be reached remotely on this
    PoE-power-only topology, so the final stage alerts the operator instead.
  triggers:
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_mesh_communication_outage
      to: 'on'
      for: 00:05:00
      id: mesh_outage
    - trigger: mqtt
      topic: zigbee2mqtt/bridge/response/permit_join
      value_template: >-
        {% set error = value_json.error | default('') %} {{ 'radio_timeout' if
        value_json.status | default('') == 'error' and ('SRSP -' in error or
        'HOST_FATAL_ERROR' in error or 'no more system responses' in error) else
        'ignore' }}
      payload: radio_timeout
      id: radio_timeout
  actions:
    - action: logbook.log
      data:
        name: Zigbee watchdog
        entity_id: binary_sensor.zigbee2mqtt_mesh_communication_outage
        message: >-
          Detekován {{ 'plošný výpadek komunikace' if trigger.id == 'mesh_outage'
          else 'ztráta komunikace s Dongle-M' }}; offline zařízení:
          {{ states('sensor.zigbee2mqtt_unavailable_device_count') }}.
    - action: system_log.write
      data:
        logger: zigbee_watchdog
        level: warning
        message: >-
          Zigbee recovery triggered by {{ trigger.id }}; unavailable devices:
          {{ states('sensor.zigbee2mqtt_unavailable_device_count') }}.
    - action: notify.mobile_app_xiaomi_15
      data:
        title: Zigbee watchdog zasahuje
        message: >-
          Důvod: {{ trigger.id }}; offline zařízení:
          {{ states('sensor.zigbee2mqtt_unavailable_device_count') }}. Restartuji
          Zigbee2MQTT. Pokud to nepomůže, musí se rebootovat EFR32MG24 ve Web
          Console Dongle-M.
        data:
          channel: alarm_stream_max
          priority: high
          ttl: 0
          tag: zigbee-mesh-outage
    - action: hassio.addon_stop
      data:
        addon: 45df7312_zigbee2mqtt
      continue_on_error: true
    - delay: 00:00:03
    - action: hassio.addon_start
      data:
        addon: 45df7312_zigbee2mqtt
      continue_on_error: true
    - wait_template: >-
        {{ is_state('binary_sensor.zigbee2mqtt_bridge_connection_state', 'on') }}
      timeout: 00:02:00
      continue_on_timeout: true
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/bridge/request/permit_join
        payload: '{"time":0,"transaction":"ha-donglem-watchdog"}'
    - wait_for_trigger:
        - trigger: mqtt
          topic: zigbee2mqtt/bridge/response/permit_join
          value_template: >-
            {{ (value_json.status | default('')) ~ ':' ~ (value_json.transaction |
            default('')) }}
          payload: ok:ha-donglem-watchdog
      timeout: 00:00:15
      continue_on_timeout: true
    - choose:
        - conditions: "{{ wait.completed }}"
          sequence:
            - action: logbook.log
              data:
                name: Zigbee watchdog
                entity_id: binary_sensor.zigbee2mqtt_mesh_communication_outage
                message: >-
                  Automatická obnova uspěla po restartu Zigbee2MQTT; Dongle-M
                  odpověděl na ZDO ověření. Offline zařízení:
                  {{ states('sensor.zigbee2mqtt_unavailable_device_count') }}.
            - action: system_log.write
              data:
                logger: zigbee_watchdog
                level: warning
                message: >-
                  Dongle-M recovery succeeded after one Zigbee2MQTT restart; ZDO
                  verification passed.
            - action: notify.mobile_app_xiaomi_15
              data:
                title: Zigbee plně obnoveno
                message: >-
                  Dongle-M odpověděl na ZDO ověření po restartu Zigbee2MQTT.
                  Offline zařízení:
                  {{ states('sensor.zigbee2mqtt_unavailable_device_count') }}.
                data:
                  tag: zigbee-mesh-outage
      default:
        - action: logbook.log
          data:
            name: Zigbee watchdog
            entity_id: binary_sensor.zigbee2mqtt_mesh_communication_outage
            message: >-
              Automatická obnova selhala; Dongle-M nepotvrdil ZDO ověření.
              Vyžadován reboot EFR32MG24.
        - action: system_log.write
          data:
            logger: zigbee_watchdog
            level: error
            message: >-
              Dongle-M did not answer ZDO verification after a Zigbee2MQTT
              restart; an EFR32MG24 reboot is required.
        - action: notify.mobile_app_xiaomi_15
          data:
            title: Zigbee vyžaduje zásah
            message: >-
              Restart Zigbee2MQTT nepomohl a Dongle-M neodpověděl na ZDO ověření.
              Otevři Web Console Dongle-M přes jeho Wi-Fi hotspot a proveď
              Settings -> Reboot Options -> Reboot EFR32MG24.
            data:
              channel: alarm_stream_max
              priority: high
              ttl: 0
              tag: zigbee-mesh-outage
  mode: single
  max_exceeded: silent
- id: zigbee2mqtt_mesh_communication_outage_recovery_log
  alias: Zigbee2MQTT - Mesh Communication Outage Recovery Log
  description: Records when a previously detected Zigbee mesh outage recovers.
  triggers:
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_mesh_communication_outage
    from: 'on'
    to: 'off'
  actions:
  - action: logbook.log
    data:
      name: Zigbee watchdog
      entity_id: binary_sensor.zigbee2mqtt_mesh_communication_outage
      message: 'Komunikace obnovena po {{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) / 60) | round(1) }} min; offline zařízení nyní: {{ states(''sensor.zigbee2mqtt_unavailable_device_count'')
        }}.'
  - action: system_log.write
    data:
      logger: zigbee_watchdog
      level: warning
      message: 'Zigbee mesh communication recovered after {{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) / 60) | round(1) }} min; unavailable devices:
        {{ states(''sensor.zigbee2mqtt_unavailable_device_count'') }}.'
  mode: single
- id: voice_autodestruct_countdown_fired
  alias: Autodestruct countdown expired - run night shutdown stub
  description: Timer-driven execution of the delayed autodestruct alias. Runs the same parser-only voice_night_shutdown stub — never a real shutdown.
  triggers:
  - trigger: event
    event_type: timer_finished
    event_data:
      entity_id: timer.voice_autodestruct
  actions:
  - action: script.voice_night_shutdown
  mode: single
- id: reauth_tripwire
  alias: Any integration needs re-authentication - notify
  description: Watches the repair-issue registry and pushes an alarm to the phone whenever ANY integration/config entry needs re-authentication or reconfiguration (OAuth token revoked/expired, e.g. OneDrive).
    Catches silent auth rot on day 1 instead of after days of failing backups/alerts.
  triggers:
  - trigger: event
    event_type: repairs_issue_registry_updated
  conditions:
  - condition: template
    value_template: "{{ trigger.event.data.action in ['create', 'update']\n   and ( 'reauth' in (trigger.event.data.translation_key | default(''))\n         or 'reconfigure' in (trigger.event.data.translation_key\
      \ | default(''))\n         or 'reauth' in (trigger.event.data.issue_id | default(''))\n         or (trigger.event.data.domain | default('')) in ['onedrive','google_drive','mobile_app','mqtt','shelly','roborock','netatmo']\n\
      \         or (trigger.event.data.domain | default('')) == 'homeassistant' ) }}"
  actions:
  - action: logbook.log
    data:
      name: Re-auth tripwire
      message: Repair issue {{ trigger.event.data.action }} on {{ trigger.event.data.domain }} / {{ trigger.event.data.issue_id }} - check Settings > Notifications; an integration likely needs re-authentication.
  - action: notify.mobile_app_xiaomi_15
    data:
      title: HA needs re-auth
      message: '{{ trigger.event.data.domain }} - {{ trigger.event.data.issue_id }}. Open Settings > Notifications to relink.'
      data:
        channel: default
        tag: reauth-tripwire
  mode: queued
