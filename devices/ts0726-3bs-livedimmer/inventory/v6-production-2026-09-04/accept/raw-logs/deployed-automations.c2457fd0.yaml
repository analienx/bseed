  - wait_template: "{{ is_state('light.lr_kitchen_table_bulbs', 'on') and
   (not linear_should_turn_on or is_state('light.livingroomlineardimmer', 'on')) }}"
    timeout:
      seconds: 60
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.livingroom_auto_on_flag
  mode: queued
  max: 2
