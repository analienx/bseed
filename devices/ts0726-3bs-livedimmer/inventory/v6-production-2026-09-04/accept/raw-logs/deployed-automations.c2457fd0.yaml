    - conditions:
      - condition: template
        value_template: '{{ as_timestamp(now()) - as_timestamp(states(''input_datetime.router_shutdown_requested_at''), 0) <= 900 }}'
      sequence:
      - action: script.router_shutdown_then_poweroff
    default:
