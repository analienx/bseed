- id: '1772404025223'
  alias: IKEA RODRET → Kitchen Table Bulbs (Smooth)
  description: IKEA E2201 RODRET — all 5 confirmed actions. brightness_move rate 83 matched from device action_rate.
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/ButtLivingRoomTableBulbsDimmer/action
    payload: brightness_move_up
    id: dim_up
  - trigger: mqtt
    topic: zigbee2mqtt/ButtLivingRoomTableBulbsDimmer/action
    payload: brightness_move_down
    id: dim_down
  - trigger: mqtt
    topic: zigbee2mqtt/ButtLivingRoomTableBulbsDimmer/action
    payload: brightness_stop
    id: dim_stop
  - trigger: mqtt
    topic: zigbee2mqtt/ButtLivingRoomTableBulbsDimmer/action
    payload: 'on'
    id: turn_on
  - trigger: mqtt
    topic: zigbee2mqtt/ButtLivingRoomTableBulbsDimmer/action
    payload: 'off'
    id: turn_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dim_up
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Kitchen Table Bulbs/set
          payload: '{"brightness_move": 83}'
          qos: 0
          retain: false
    - conditions:
      - condition: trigger
        id: dim_down
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Kitchen Table Bulbs/set
          payload: '{"brightness_move": -83}'
          qos: 0
          retain: false
    - conditions:
      - condition: trigger
        id: dim_stop
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Kitchen Table Bulbs/set
          payload: '{"brightness_move": 0}'
          qos: 0
          retain: false
    - conditions:
      - condition: trigger
        id: turn_on
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Kitchen Table Bulbs/set
          payload: '{"state": "ON"}'
          qos: 0
          retain: false
    - conditions:
      - condition: trigger
        id: turn_off
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Kitchen Table Bulbs/set
          payload: '{"state": "OFF", "transition": 2}'
