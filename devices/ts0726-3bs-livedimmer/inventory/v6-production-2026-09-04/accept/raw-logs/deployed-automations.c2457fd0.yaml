- id: '1772380568342'
  alias: WR1 - Workroom - Turn ON
  description: 'Sensor: WorkRoomPIREntrance → MQTT (ZG-204ZL). Dark check: sunset+offset / sunrise+offset. Skip if WorkroomTableLeftDimmer is on. Cooldown: skips auto-on if manually turned off within cooldown.
    Target: light.workroomledmaindimmer. Waits for light state confirmation before clearing auto_on_flag to prevent false manual-on detection from Z2M MQTT round-trip delay.'
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/WorkRoomPIREntrance
    value_template: '{{ value_json.get(''occupancy'', '''') | string | lower }}'
    payload: 'true'
  conditions:
  - condition: state
    entity_id: input_boolean.shutdown_in_progress
    state: 'off'
  - condition: template
    value_template: "{% set sunset_offset_sec = states('input_number.workroom_sunset_offset_min') | float(0) * 60 %} {% set sunrise_offset_sec = states('input_number.workroom_sunrise_offset_min') | float(0)\
      \ * 60 %} {% set now_ts = now().timestamp() %} {% set next_rising_ts = as_timestamp(state_attr('sun.sun', 'next_rising')) %} {% set next_setting_ts = as_timestamp(state_attr('sun.sun', 'next_setting'))\
      \ %} {% set is_night = next_rising_ts < next_setting_ts %} {% if is_night %}\n  {% set last_sunset_ts = next_setting_ts - 86400 %}\n  {% set past_sunset = now_ts >= (last_sunset_ts + sunset_offset_sec)\
      \ %}\n  {% set before_sunrise = now_ts < (next_rising_ts + sunrise_offset_sec) %}\n  {{ past_sunset and before_sunrise }}\n{% else %}\n  {% set last_rising_ts = next_rising_ts - 86400 %}\n  {% set\
      \ in_post_sunrise = sunrise_offset_sec > 0 and now_ts < (last_rising_ts + sunrise_offset_sec) %}\n  {% set in_pre_sunset = sunset_offset_sec < 0 and now_ts >= (next_setting_ts + sunset_offset_sec)\
      \ %}\n  {{ in_post_sunrise or in_pre_sunset }}\n{% endif %}"
  - condition: template
    value_template: '{{ states(''light.workroomtableleftdimmer'') not in [''on''] }}'
  - condition: state
    entity_id: timer.workroom_manual_off_cooldown
    state: idle
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.workroom_auto_on_flag
  - action: light.turn_on
    target:
      entity_id: light.workroomledmaindimmer
    data: {}
  - wait_template: '{{ is_state(''light.workroomledmaindimmer'', ''on'') }}'
    timeout:
      seconds: 5
  - if:
    - condition: template
      value_template: '{% set cur = state_attr(''light.workroomledmaindimmer'', ''brightness'') | int(0) %} {% set min_255 = (states(''input_number.workroom_dimmer_min_brightness_pct'') | float(50) / 100
        * 255) | int %} {{ cur < min_255 }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.workroomledmaindimmer
      data:
        brightness_pct: '{{ states(''input_number.workroom_dimmer_min_brightness_pct'') | int(50) }}'
  - wait_template: '{{ is_state(''light.workroomledmaindimmer'', ''on'') }}'
    timeout:
      seconds: 60
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.workroom_auto_on_flag
  mode: restart
- id: '1772380818957'
  alias: WR2 - Workroom - Turn OFF
  description: Turns off workroomledmaindimmer when sensor quiet. Timeout extended when manually turned on. Zombie failsafe if sensor gets physically stuck ON. Auto-off flag held until light state confirms
    off to prevent false cooldown trigger from Z2M round-trip delay.
