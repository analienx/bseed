- id: butt_bedroom_cabinet_scenes_brightness
  alias: 'ButtBedroomCabinet: Color Temp + Brightness (Bedroom Lights)'
  description: 'IKEA E2001/E2002 5-button remote. Left/Right: cycle color temps. On/Off: toggle. Hold Up/Down: smooth brightness. Auto-powers relay if off.'
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/ButtBedroomCabinet/action
    id: remote_action
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: switch.bedroomdimmer_relay
      state: 'off'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.bedroomdimmer_relay
    - delay:
        seconds: 2
  - variables:
      scenes:
      - Cold
      - Neutral
      - Semi-Warm
      - Warm
      - Warmest
      scene_mireds:
        Cold: 250
        Neutral: 290
        Semi-Warm: 355
        Warm: 410
        Warmest: 454
      current: '{{ states(''input_select.bedroom_lights_scene'') }}'
      current_idx: '{{ scenes.index(current) if current in scenes else 0 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''on'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedroom_lights
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''off'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_lights
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''arrow_right_click'' }}'
      sequence:
      - variables:
          next_idx: '{{ (current_idx + 1) % (scenes | length) }}'
          next_scene: '{{ scenes[next_idx | int] }}'
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Bedroom Lights/set
          payload: '{"color_temp": {{ scene_mireds[next_scene] }}}'
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_lights_scene
        data:
          option: '{{ next_scene }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''arrow_left_click'' }}'
      sequence:
      - variables:
          prev_idx: '{{ (current_idx - 1) % (scenes | length) }}'
          prev_scene: '{{ scenes[prev_idx | int] }}'
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Bedroom Lights/set
          payload: '{"color_temp": {{ scene_mireds[prev_scene] }}}'
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_lights_scene
        data:
          option: '{{ prev_scene }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''brightness_move_up'' }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Bedroom Lights/set
          payload: '{"brightness_move": 83}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''brightness_move_down'' }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Bedroom Lights/set
          payload: '{"brightness_move": -83}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload == ''brightness_stop'' }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/Bedroom Lights/set
          payload: '{"brightness_move": 0}'
  mode: restart
  max_exceeded: silent
- id: '1773515703152'
  alias: Hall Bulbs - Scheduled Color Temperature
  description: 'Sets Hall bulbs at schedule boundaries and when a Hall bulb turns on. Schedule: coolest at midday (153), warmest at night (500).'
  triggers:
  - trigger: time
    at:
    - 05:00:00
    - 08:00:00
    - '15:00:00'
    - '17:00:00'
    - '19:00:00'
    - '20:00:00'
  - trigger: state
    entity_id:
    - light.hallbulb1
    - light.hallbulb2
    - light.hallbulb3
    to: 'on'
  actions:
  - variables:
      h: '{{ now().hour }}'
      target_mireds: "{% if h >= 20 or h <= 4 %}\n  500\n{% elif h == 5 %}\n  370\n{% elif h <= 7 %}\n  250\n{% elif h <= 14 %}\n  153\n{% elif h <= 16 %}\n  250\n{% elif h <= 18 %}\n  370\n{% elif h ==\
        \ 19 %}\n  454\n{% endif %}\n"
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/HallBulb1/set
      payload: '{"color_temp": {{ target_mireds }}}'
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/HallBulb2/set
      payload: '{"color_temp": {{ target_mireds }}}'
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/HallBulb3/set
      payload: '{"color_temp": {{ target_mireds }}}'
  mode: single
- id: '1769552351275'
  alias: Boot - deterministic EMQX then Zigbee2MQTT
  description: Starting zigbee2mqtt once emqx is ready
  triggers:
  - event: start
    trigger: homeassistant
  actions:
  - wait_template: "{{ states(emqx_running) not in ['unknown','unavailable','none']\n   and states(z2m_running) not in ['unknown','unavailable','none'] }}\n"
    timeout: 00:05:00
    continue_on_timeout: false
  - choose:
    - conditions: '{{ is_state(emqx_running, ''off'') }}'
      sequence:
      - data:
          addon: '{{ emqx_slug }}'
        action: hassio.addon_start
      - wait_template: '{{ is_state(emqx_running, ''on'') }}'
        timeout: 00:02:00
        continue_on_timeout: false
  - data:
      topic: '{{ mqtt_ok_topic }}'
      payload: ok
      retain: true
    action: mqtt.publish
  - wait_template: '{{ is_state(mqtt_ok_sensor, ''ok'') }}'
    timeout: 00:01:00
    continue_on_timeout: false
  - repeat:
      count: 3
      sequence:
      - data:
          addon: '{{ z2m_slug }}'
        action: hassio.addon_start
      - wait_template: '{{ is_state(z2m_running, ''on'') }}'
        timeout: 00:02:00
        continue_on_timeout: true
      - choose:
        - conditions: '{{ is_state(z2m_running, ''on'') }}'
          sequence:
          - stop: Zigbee2MQTT is running
      - data:
          addon: '{{ z2m_slug }}'
        action: hassio.addon_restart
  mode: single
  variables:
    emqx_slug: a0d7b954_emqx
    z2m_slug: 45df7312_zigbee2mqtt
    emqx_running: binary_sensor.emqx_running
    z2m_running: binary_sensor.zigbee2mqtt_running
    mqtt_ok_sensor: sensor.mqtt_healthcheck
    mqtt_ok_topic: ha/healthcheck
- id: security_entry_door_open_audible_alert
  alias: Security / Entry / Door Open Audible Alert
  description: Plays the selected Doorbell on every door-open transition, then a separate reminder after the configured delay and each further minute while it remains open. A close cancels the reminder
    immediately.
  triggers:
  - trigger: state
    entity_id: binary_sensor.doorsensor_contact
    from: 'off'
    to: 'on'
    id: opened
  - trigger: state
    entity_id: binary_sensor.doorsensor_contact
    from: 'on'
    to: 'off'
    id: closed
  conditions: []
  actions:
  - choose:
    - conditions: '{{ trigger.id == ''closed'' }}'
      sequence:
      - stop: Door closed; cancel the open-door reminder.
    - conditions:
      - condition: state
        entity_id: input_boolean.hall_door_alerts_enabled
        state: 'on'
      sequence:
      - action: script.audio_play_sound
        data:
          path: '{{ states(''input_select.hall_door_initial_sound'') }}'
          volume: '{{ states(''input_number.hall_door_alert_volume'') | float(0.7) }}'
      - delay:
          seconds: '{{ states(''input_number.hall_door_reminder_delay_sec'') | int(60) }}'
      - repeat:
          while:
          - condition: state
            entity_id: binary_sensor.doorsensor_contact
            state: 'on'
          - condition: state
            entity_id: input_boolean.hall_door_alerts_enabled
            state: 'on'
          sequence:
          - action: script.audio_alert
            data:
              sound: '{{ states(''input_select.hall_door_reminder_sound'') }}'
              volume: '{{ states(''input_number.hall_door_alert_volume'') | float(0.7) }}'
              message: '{{ states(''input_text.hall_door_reminder_tts_text'') | trim or ''The hall door is still open.'' }}'
          - wait_template: '{{ is_state(''binary_sensor.doorsensor_contact'', ''off'') or is_state(''input_boolean.hall_door_alerts_enabled'', ''off'') }}'
            timeout: 00:01:00
            continue_on_timeout: true
  mode: restart
- id: router_shutdown_resume_after_core_restart
  alias: Router Shutdown / Resume After Core Restart
  description: Completes a router shutdown interrupted by a Core restart, but only for a shutdown requested in the previous 15 minutes.
  triggers:
