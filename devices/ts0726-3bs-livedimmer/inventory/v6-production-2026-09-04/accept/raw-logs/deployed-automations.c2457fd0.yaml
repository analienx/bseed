- id: button_ha_shutdown_click
  alias: Shutdown - HA Only (Manual and Scheduled)
  description: Handles graceful shutdown for Home Assistant and SLZB06 coordinator only. Supports manual button press and automatic scheduled shutdown.
  triggers:
  - trigger: state
    entity_id: input_button.button_ha_shutdown
    id: manual
  - trigger: time
    at: input_datetime.sleep_time_ha_automatic
    id: scheduled
  conditions:
  - condition: template
    value_template: "{{ \n  trigger.id == 'manual' or \n  (trigger.id == 'scheduled' and is_state('input_boolean.ha_shutdown', 'on')) \n}}\n"
  actions:
  - action: persistent_notification.create
    data:
      title: HA Shutdown Initiated
      message: '{% if trigger.id == ''manual'' %} • Trigger: Manual button press {% else %} • Trigger: Scheduled at {{ states(''input_datetime.sleep_time_ha_automatic'') }} {% endif %} • Wake Mode: {{ states(''input_select.wake_mode_ha'')
        }}

        '
  - action: script.unified_shutdown
    data:
      shutdown_type: ha
      trigger_source: '{{ trigger.id }}'
  mode: single
- id: shutdown_unified_manual_and_scheduled
  alias: Shutdown - Unified (Manual and Scheduled)
  description: Handles the full scheduled or manual shutdown of the router and Home Assistant.
  triggers:
  - trigger: state
    entity_id: input_button.button_shutdown
    id: manual
  - trigger: mqtt
    topic: zigbee2mqtt/ButtNetwork/action
    payload: hold
    id: manual
  - trigger: mqtt
    topic: zigbee2mqtt/ButtDoor/action
    payload: hold
    id: manual
  - trigger: time
    at: input_datetime.sleep_time_automatic
    id: scheduled
  conditions:
  - condition: template
    value_template: "{{ \n  trigger.id == 'manual' or \n  (trigger.id == 'scheduled' and is_state('input_boolean.night_shutdown', 'on')) \n}}\n"
  actions:
  - action: persistent_notification.create
    data:
      title: Unified Shutdown Initiated
      message: '{% if trigger.id == ''manual'' %} • Trigger: Manual ({{ trigger.entity_id if trigger.platform == ''state'' else trigger.topic }}) {% else %} • Trigger: Scheduled at {{ states(''input_datetime.sleep_time_automatic'')
        }} {% endif %} • Wake Mode: {{ states(''input_select.wake_mode_unified'') }}

        '
  - action: script.unified_shutdown
    data:
      shutdown_type: unified
      trigger_source: '{{ trigger.id }}'
  mode: single
- id: shutdown_router_manual_and_scheduled
  alias: Shutdown - Router Only (Manual)
  description: Handles an explicitly requested ASUS router shutdown only.
  triggers:
  - trigger: state
    entity_id: input_button.button_router_shutdown
    id: manual
  - trigger: mqtt
    topic: zigbee2mqtt/ButtDoor/action
    payload: double
    id: manual
  - trigger: mqtt
    topic: zigbee2mqtt/ButtWifiSocketRightRemote/action
    payload: 'off'
    id: manual
  conditions: []
  actions:
  - action: persistent_notification.create
    data:
      title: Router Shutdown Initiated
      message: '{% if trigger.id == ''manual'' %} • Trigger: Manual ({{ trigger.entity_id if trigger.platform == ''state'' else trigger.topic }}) {% else %} • Trigger: Scheduled at {{ states(''input_datetime.sleep_time_router_automatic'')
        }} {% endif %} • Wake Mode: {{ states(''input_select.wake_mode_router'') }}

        '
  - action: script.unified_shutdown
    data:
      shutdown_type: router
      trigger_source: '{{ trigger.id }}'
  mode: single
- id: button_sleeper_hold
  alias: 'ButtNetwork: Single → Router On'
  description: Single press powers on the router. Wi-Fi radio toggle was removed because ASUS stock firmware is now used and Wi-Fi switching is no longer needed.
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/ButtNetwork/action
    payload: single
    id: single
  conditions: []
  actions:
  - action: system_log.write
    data:
      message: ButtNetwork single click → powering on router
      level: info
  - action: script.router_poweron
  mode: single
- id: ha_startup_handler
  alias: HA Startup Handler
  description: Restores the WiFi Left socket on HA start and plays the optional startup cue. Router recovery runs independently so Zigbee or audio startup cannot block it.
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - alias: Ensure Recorder is enabled after startup
    action: recorder.enable
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.shutdown_recorder_watchdog
  - alias: Restore WiFi Left socket until it reports on
    repeat:
      sequence:
      - wait_template: '{{ states(''switch.livingroomsocketwifileft_relay'') not in [''unknown'', ''unavailable''] }}'
        timeout: 00:00:15
        continue_on_timeout: true
      - if: '{{ states(''switch.livingroomsocketwifileft_relay'') not in [''unknown'', ''unavailable''] }}'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.livingroomsocketwifileft_relay
        - wait_template: '{{ is_state(''switch.livingroomsocketwifileft_relay'', ''on'') }}'
          timeout: 00:00:20
          continue_on_timeout: true
      - if: '{{ not is_state(''switch.livingroomsocketwifileft_relay'', ''on'') }}'
        then:
        - delay: 00:00:10
      until:
      - condition: state
        entity_id: switch.livingroomsocketwifileft_relay
        state: 'on'
  - alias: Wait for USB audio before startup cue
    wait_template: '{{ states(''media_player.usb_audio_device_analog_stereo'') not in [''unknown'', ''unavailable''] }}'
    timeout: 00:02:00
    continue_on_timeout: true
  - alias: Play selected Home Assistant startup sound
    if: '{{ states(''media_player.usb_audio_device_analog_stereo'') not in [''unknown'', ''unavailable''] }}'
    then:
    - action: script.audio_play_sound
      data:
        path: '{{ states(''input_select.ha_startup_sound'') }}'
  - action: script.smart_startup_sequence
    data: {}
    enabled: true
  mode: single
- id: ha_startup_router_recovery
  alias: Network / Restore Router After HA Start
  description: Keeps router recovery independent of Zigbee and audio startup until WAN, LAN ping, or outlet draw confirms readiness.
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.router_shutdown_pending
    state: 'off'
  actions:
  - action: script.ensure_router_power_on_with_retries
  mode: restart
- id: shutdown_recorder_recovery_watchdog
  alias: Shutdown / Recorder Recovery Watchdog
  description: Re-enables Recorder if a requested Home Assistant shutdown did not occur within two minutes.
  triggers:
  - trigger: state
    entity_id: input_boolean.shutdown_recorder_watchdog
    to: 'on'
    for: 00:02:00
  conditions:
  - condition: state
    entity_id: input_boolean.shutdown_recorder_watchdog
    state: 'on'
  actions:
  - action: recorder.enable
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.shutdown_recorder_watchdog
  - action: input_text.set_value
    target:
      entity_id: input_text.shutdown_load_result
    data:
      value: Shutdown did not complete within two minutes; Recorder was re-enabled.
  - action: persistent_notification.create
    data:
      title: Recorder re-enabled after incomplete shutdown
      message: Home Assistant remained online two minutes after Recorder was disabled. Verify the host shutdown request.
  mode: single
- id: '1746989579040'
  alias: Router Turn on - Wifi Socket On
  description: Turns on Router socket powering on the router
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/ButtWifiSocketRightRemote/action
    payload: single
    alias: When MQTT received - LivingRoomSocketWifiRight single
  - alias: When MQTT received - door butt router socket power on
    trigger: mqtt
    topic: zigbee2mqtt/ButtDoor/action
    payload: 'on'
  conditions: []
  actions:
  - action: script.router_poweron
    metadata: {}
    data: {}
  mode: single
- id: door_closed_morning_router_shutdown
  alias: Door Closed → Morning Lights Off
  description: When the front door is closed and stays closed for 3 minutes on weekday mornings, turn off lights. It never changes router power.
  triggers:
  - alias: Door stays closed for 3 minutes
    trigger: state
    entity_id: binary_sensor.front_door
    from: 'on'
    to: 'off'
    for: 00:03:00
  conditions:
  - alias: Morning window weekdays
    condition: time
    after: 07:30:00
    before: '12:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id:
      - input_boolean.hall_entrance_auto_off_flag
      - input_boolean.hall_main_auto_off_flag
      - input_boolean.livingroom_auto_off_flag
      - input_boolean.workroom_auto_off_flag
      - input_boolean.bathroom_auto_off_flag
  - alias: Turn off lights
    action: light.turn_off
    target:
      entity_id: all
    data: {}
  - delay:
      seconds: 5
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.hall_entrance_auto_off_flag
      - input_boolean.hall_main_auto_off_flag
      - input_boolean.livingroom_auto_off_flag
      - input_boolean.workroom_auto_off_flag
      - input_boolean.bathroom_auto_off_flag
      - input_boolean.hall_entrance_manual_on_flag
      - input_boolean.hall_main_manual_on_flag
      - input_boolean.livingroom_manual_on_flag
      - input_boolean.workroom_manual_on_flag
      - input_boolean.bathroom_manual_on_flag
  mode: single
- id: '1768080854838'
  alias: Router Power Buttons
  description: Controls router power via Zigbee buttons (Hall Door)
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/ButtHallDoor
  conditions:
  - condition: template
    value_template: '{{ ''action'' in trigger.payload_json }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.payload_json.action == 'arrow_left_click' or \n   trigger.payload_json.action == 'off_hold' }}"
      sequence:
      - action: script.router_shutdown_then_poweroff
        data: {}
    - conditions:
      - condition: template
        value_template: "{{ trigger.payload_json.action == 'arrow_right_click' or \n   trigger.payload_json.action == 'off_press' }}"
      sequence:
      - action: script.ensure_router_power_on_with_retries
        data: {}
  mode: single
- id: '1771626265768'
  alias: A1a - Hall Entrance - Turn ON
  description: 'Owns Hall entrance lights for door-open or entrance motion when dark. Dark check priority: HallEntranceIlluminance (G-106Z) checked first if available, HallPIRSensorBedroomAdvanced illuminance
    also checked independently — each with its own dashboard threshold. Falls back to sunset/sunrise timing only when BOTH sensors are unavailable. HallPIRAdvanced (TS0202) fires on occupancy only. Bulbs
    and shoes LED have independent cooldowns. HallBulb1 and HallBulb2 are controlled individually because Z2M group 14 does not actuate reliably. Waits for individual bulb state confirmation before clearing
    auto_on_flag.

    '
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/DoorSensor
    value_template: '{{ value_json.contact | string | lower }}'
    payload: 'false'
  - trigger: mqtt
    topic: zigbee2mqtt/HallPIRSensorEntrance
    value_template: '{{ value_json.get(''occupancy'') | string | lower }}'
    payload: 'true'
  - trigger: mqtt
    topic: zigbee2mqtt/HallCabinetPIR
    value_template: '{{ value_json.get(''presence'') | string | lower }}'
    payload: 'true'
  - trigger: mqtt
    topic: zigbee2mqtt/HallPIRAdvanced
    value_template: '{{ value_json.get(''occupancy'') | string | lower }}'
    payload: 'true'
  conditions:
  - condition: state
    entity_id: input_boolean.shutdown_in_progress
    state: 'off'
  - condition: template
    alias: Skip if nothing to turn on (deduplication guard)
    value_template: "{{ (is_state('timer.hall_entrance_bulbs_manual_off_cooldown', 'idle') and\n    not (is_state('light.hallbulb1', 'on') and is_state('light.hallbulb2', 'on'))) or\n   (is_state('timer.hall_shoesled_manual_off_cooldown',\
      \ 'idle') and\n    not is_state('light.hallshoesled', 'on')) }}\n"
  - condition: template
    value_template: "{# --- HallEntranceIlluminance (G-106Z) --- #} {% set entrance_lux = states('sensor.hallentranceilluminance_illuminance') | float(-1) %} {% set entrance_threshold = states('input_number.hall_entrance_illuminance_threshold_lux')\
      \ | float(50) %} {% set entrance_available = entrance_lux >= 0 %} {% set entrance_dark = entrance_available and entrance_lux < entrance_threshold %}\n{# --- HallPIRSensorBedroomAdvanced illuminance\
      \ --- #} {% set bedroom_lux = states('sensor.hallpirsensorbedroomadvanced_illuminance') | float(-1) %} {% set bedroom_threshold = states('input_number.hall_illuminance_threshold_lux') | float(100)\
      \ %} {% set bedroom_available = bedroom_lux >= 0 %} {% set bedroom_dark = bedroom_available and bedroom_lux < bedroom_threshold %}\n{# --- Timing fallback (only used when both sensors unavailable)\
      \ --- #} {% set sunset_offset_sec = states('input_number.hall_sunset_offset_min') | float(0) * 60 %} {% set sunrise_offset_sec = states('input_number.hall_sunrise_offset_min') | float(0) * 60 %} {%\
      \ set now_ts = now().timestamp() %} {% set nextrising_ts = as_timestamp(state_attr('sun.sun', 'next_rising')) %} {% set nextsetting_ts = as_timestamp(state_attr('sun.sun', 'next_setting')) %} {% set\
      \ is_night = nextrising_ts < nextsetting_ts %} {% if is_night %}\n  {% set last_sunset_ts = nextsetting_ts - 86400 %}\n  {% set past_sunset = now_ts > last_sunset_ts + sunset_offset_sec %}\n  {% set\
      \ before_sunrise = now_ts < nextrising_ts + sunrise_offset_sec %}\n  {% set time_dark = past_sunset and before_sunrise %}\n{% else %}\n  {% set last_rising_ts = nextrising_ts - 86400 %}\n  {% set\
      \ in_post_sunrise = sunrise_offset_sec > 0 and now_ts < last_rising_ts + sunrise_offset_sec %}\n  {% set in_pre_sunset = sunset_offset_sec > 0 and now_ts < nextsetting_ts + sunset_offset_sec %}\n\
      \  {% set time_dark = in_post_sunrise or in_pre_sunset %}\n{% endif %}\n{% if entrance_available or bedroom_available %}\n  {{ entrance_dark or bedroom_dark }}\n{% else %}\n  {{ time_dark }}\n{% endif\
      \ %}\n"
  - condition: template
    value_template: "{{ is_state('timer.hall_entrance_bulbs_manual_off_cooldown', 'idle') or\n   is_state('timer.hall_shoesled_manual_off_cooldown', 'idle') }}\n"
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hall_entrance_auto_on_flag
  - if:
    - condition: state
      entity_id: timer.hall_entrance_bulbs_manual_off_cooldown
      state: idle
    then:
    - variables:
        hall_bulb_min_brightness: '{{ [(states(''input_number.hall_bulbs_min_brightness_pct'') | float(50) / 100 * 255) | int(128), 1] | max }}'
        hall_bulb1_target: '{{ [state_attr(''light.hallbulb1'', ''brightness'') | int(0), hall_bulb_min_brightness] | max }}'
        hall_bulb2_target: '{{ [state_attr(''light.hallbulb2'', ''brightness'') | int(0), hall_bulb_min_brightness] | max }}'
    - action: light.turn_on
      target:
        entity_id: light.hallbulb1
      data:
        brightness: '{{ hall_bulb1_target }}'
        transition: 1
    - action: light.turn_on
      target:
        entity_id: light.hallbulb2
      data:
        brightness: '{{ hall_bulb2_target }}'
        transition: 1
  - if:
    - condition: state
      entity_id: timer.hall_shoesled_manual_off_cooldown
      state: idle
    then:
    - action: light.turn_on
      target:
        entity_id: light.hallshoesled
      data:
        transition: 1
  - wait_template: "{{ (not is_state('timer.hall_entrance_bulbs_manual_off_cooldown', 'idle') or\n    (is_state('light.hallbulb1', 'on') and is_state('light.hallbulb2', 'on'))) and\n   (not is_state('timer.hall_shoesled_manual_off_cooldown',\
      \ 'idle') or\n    is_state('light.hallshoesled', 'on')) }}\n"
    timeout:
      seconds: 5
  - if:
    - condition: template
      value_template: '{% set cur = state_attr(''light.hallbulb1'', ''brightness'') | int(0) %} {% set min255 = (states(''input_number.hall_bulbs_min_brightness_pct'') | float(50) / 100 * 255) | int %}
        {{ is_state(''light.hallbulb1'', ''on'') and cur < min255 }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.hallbulb1
      data:
        brightness: '{{ hall_bulb_min_brightness }}'
        transition: 1
  - if:
    - condition: template
      value_template: '{% set cur = state_attr(''light.hallbulb2'', ''brightness'') | int(0) %} {% set min255 = (states(''input_number.hall_bulbs_min_brightness_pct'') | float(50) / 100 * 255) | int %}
        {{ is_state(''light.hallbulb2'', ''on'') and cur < min255 }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.hallbulb2
      data:
        brightness: '{{ hall_bulb_min_brightness }}'
        transition: 1
  - if:
    - condition: template
      value_template: '{% set cur = state_attr(''light.hallshoesled'', ''brightness'') | int(0) %} {% set min255 = (states(''input_number.hall_shoesled_min_brightness_pct'') | float(30) / 100 * 255) | int
        %} {{ is_state(''light.hallshoesled'', ''on'') and cur < min255 }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.hallshoesled
      data:
        brightness_pct: '{{ states(''input_number.hall_shoesled_min_brightness_pct'') | int(30) }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''timer.hall_entrance_bulbs_manual_off_cooldown'', ''idle'') and not is_state(''light.hallbulb1'', ''on'') }}'
    then:
    - action: system_log.write
      data:
        level: warning
        logger: automation.a1a
        message: 'A1a: HallBulb1 did not confirm ON after initial attempt; retrying once.'
    - action: light.turn_on
      target:
        entity_id: light.hallbulb1
      data:
        brightness: '{{ hall_bulb_min_brightness }}'
        transition: 1
  - if:
    - condition: template
      value_template: '{{ is_state(''timer.hall_entrance_bulbs_manual_off_cooldown'', ''idle'') and not is_state(''light.hallbulb2'', ''on'') }}'
    then:
    - action: system_log.write
      data:
        level: warning
        logger: automation.a1a
        message: 'A1a: HallBulb2 did not confirm ON after initial attempt; retrying once.'
    - action: light.turn_on
      target:
        entity_id: light.hallbulb2
      data:
        brightness: '{{ hall_bulb_min_brightness }}'
        transition: 1
  - wait_template: "{{ not is_state('timer.hall_entrance_bulbs_manual_off_cooldown', 'idle') or
   (is_state('light.hallbulb1', 'on') and is_state('light.hallbulb2', 'on')) }}"
    timeout:
      seconds: 60
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hall_entrance_auto_on_flag
  mode: queued
  max: 3
- id: manual_on_detection_startup_coordinator
  alias: Manual-On Detection - Startup Coordinator
  description: Keeps Manual-On inference disarmed until Z2M is online, each target has reported after this HA boot or reconnect, and its primary state has been quiet for 10 seconds. Disarms the affected zone during individual target unavailable/unknown states.
  triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_online
    to:
    - 'off'
    - 'unknown'
    - 'unavailable'
    id: backend_offline
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_online
    to: 'on'
    id: backend_online
  - trigger: template
    value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and as_timestamp(states.light.hallbulb1.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) and as_timestamp(states.light.hallbulb2.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
    id: hall_entrance_seen
  - trigger: template
    value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and as_timestamp(states.light.hallbulb3.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
    id: hall_main_seen
  - trigger: template
    value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and as_timestamp(states.light.lr_kitchen_table_bulbs.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) and as_timestamp(states.light.livingroomlineardimmer.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
    id: livingroom_seen
  - trigger: template
    value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and as_timestamp(states.light.workroomledmaindimmer.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
    id: workroom_seen
  - trigger: template
    value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and as_timestamp(states.switch.bathroomswitchrouter.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
    id: bathroom_seen
  - trigger: state
    entity_id:
    - light.hallbulb1
    - light.hallbulb2
    - light.hallbulb3
    - light.lr_kitchen_table_bulbs
    - light.livingroomlineardimmer
    - light.workroomledmaindimmer
    - switch.bathroomswitchrouter
    id: primary_state_change
  - trigger: event
    event_type: timer.finished
    id: settle_finished
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: backend_offline
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.manual_on_detection_bootstrap_started_at
        data:
          datetime: "{{ now().isoformat() }}"
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.manual_on_detection_backend_ready
          - input_boolean.manual_on_detection_hall_entrance_armed
          - input_boolean.manual_on_detection_hall_main_armed
          - input_boolean.manual_on_detection_livingroom_armed
          - input_boolean.manual_on_detection_workroom_armed
          - input_boolean.manual_on_detection_bathroom_armed
      - action: timer.cancel
        target:
          entity_id:
          - timer.manual_on_detection_hall_entrance_settle
          - timer.manual_on_detection_hall_main_settle
          - timer.manual_on_detection_livingroom_settle
          - timer.manual_on_detection_workroom_settle
          - timer.manual_on_detection_bathroom_settle
    - conditions:
      - condition: trigger
        id: backend_online
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.manual_on_detection_bootstrap_started_at
        data:
          datetime: "{{ now().isoformat() }}"
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.manual_on_detection_backend_ready
          - input_boolean.manual_on_detection_hall_entrance_armed
          - input_boolean.manual_on_detection_hall_main_armed
          - input_boolean.manual_on_detection_livingroom_armed
          - input_boolean.manual_on_detection_workroom_armed
          - input_boolean.manual_on_detection_bathroom_armed
      - action: timer.cancel
        target:
          entity_id:
          - timer.manual_on_detection_hall_entrance_settle
          - timer.manual_on_detection_hall_main_settle
          - timer.manual_on_detection_livingroom_settle
          - timer.manual_on_detection_workroom_settle
          - timer.manual_on_detection_bathroom_settle
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.manual_on_detection_backend_ready
    - conditions:
      - condition: trigger
        id: startup
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.manual_on_detection_bootstrap_started_at
        data:
          datetime: "{{ now().isoformat() }}"
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.manual_on_detection_backend_ready
          - input_boolean.manual_on_detection_hall_entrance_armed
          - input_boolean.manual_on_detection_hall_main_armed
          - input_boolean.manual_on_detection_livingroom_armed
          - input_boolean.manual_on_detection_workroom_armed
          - input_boolean.manual_on_detection_bathroom_armed
          - input_boolean.hall_entrance_manual_on_flag
          - input_boolean.hall_main_manual_on_flag
          - input_boolean.livingroom_manual_on_flag
          - input_boolean.workroom_manual_on_flag
          - input_boolean.bathroom_manual_on_flag
          - input_boolean.restroom_manual_on_flag
      - wait_template: "{{ is_state('binary_sensor.zigbee2mqtt_bridge_online', 'on') }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.manual_on_detection_backend_ready
    - conditions:
      - condition: trigger
        id: hall_entrance_seen
      - condition: state
        entity_id: input_boolean.manual_on_detection_hall_entrance_armed
        state: 'off'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.manual_on_detection_hall_entrance_settle
        data:
          duration: '00:00:10'
    - conditions:
      - condition: trigger
        id: hall_main_seen
      - condition: state
        entity_id: input_boolean.manual_on_detection_hall_main_armed
        state: 'off'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.manual_on_detection_hall_main_settle
        data:
          duration: '00:00:10'
    - conditions:
      - condition: trigger
        id: livingroom_seen
      - condition: state
        entity_id: input_boolean.manual_on_detection_livingroom_armed
        state: 'off'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.manual_on_detection_livingroom_settle
        data:
          duration: '00:00:10'
    - conditions:
      - condition: trigger
        id: workroom_seen
      - condition: state
        entity_id: input_boolean.manual_on_detection_workroom_armed
        state: 'off'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.manual_on_detection_workroom_settle
        data:
          duration: '00:00:10'
    - conditions:
      - condition: trigger
        id: bathroom_seen
      - condition: state
        entity_id: input_boolean.manual_on_detection_bathroom_armed
        state: 'off'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.manual_on_detection_bathroom_settle
        data:
          duration: '00:00:10'
    - conditions:
      - condition: trigger
        id: primary_state_change
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.state in ['unknown', 'unavailable'] }}"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in ['light.hallbulb1', 'light.hallbulb2'] }}"
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.manual_on_detection_hall_entrance_armed
          - action: timer.cancel
            target:
              entity_id: timer.manual_on_detection_hall_entrance_settle
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id == 'light.hallbulb3' }}"
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.manual_on_detection_hall_main_armed
          - action: timer.cancel
            target:
              entity_id: timer.manual_on_detection_hall_main_settle
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in ['light.lr_kitchen_table_bulbs', 'light.livingroomlineardimmer'] }}"
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.manual_on_detection_livingroom_armed
          - action: timer.cancel
            target:
              entity_id: timer.manual_on_detection_livingroom_settle
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id == 'light.workroomledmaindimmer' }}"
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.manual_on_detection_workroom_armed
          - action: timer.cancel
            target:
              entity_id: timer.manual_on_detection_workroom_settle
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id == 'switch.bathroomswitchrouter' }}"
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.manual_on_detection_bathroom_armed
          - action: timer.cancel
            target:
              entity_id: timer.manual_on_detection_bathroom_settle
    - conditions:
      - condition: trigger
        id: primary_state_change
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state != trigger.to_state.state }}"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in ['light.hallbulb1', 'light.hallbulb2'] and is_state('input_boolean.manual_on_detection_hall_entrance_armed', 'off') and is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('light.hallbulb1') not in ['unknown', 'unavailable'] and states('light.hallbulb2') not in ['unknown', 'unavailable'] }}"
          sequence:
          - action: timer.start
            target:
              entity_id: timer.manual_on_detection_hall_entrance_settle
            data:
              duration: '00:00:10'
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id == 'light.hallbulb3' and is_state('input_boolean.manual_on_detection_hall_main_armed', 'off') and is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('light.hallbulb3') not in ['unknown', 'unavailable'] }}"
          sequence:
          - action: timer.start
            target:
              entity_id: timer.manual_on_detection_hall_main_settle
            data:
              duration: '00:00:10'
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id in ['light.lr_kitchen_table_bulbs', 'light.livingroomlineardimmer'] and is_state('input_boolean.manual_on_detection_livingroom_armed', 'off') and is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('light.lr_kitchen_table_bulbs') not in ['unknown', 'unavailable'] and states('light.livingroomlineardimmer') not in ['unknown', 'unavailable'] }}"
          sequence:
          - action: timer.start
            target:
              entity_id: timer.manual_on_detection_livingroom_settle
            data:
              duration: '00:00:10'
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id == 'light.workroomledmaindimmer' and is_state('input_boolean.manual_on_detection_workroom_armed', 'off') and is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('light.workroomledmaindimmer') not in ['unknown', 'unavailable'] }}"
          sequence:
          - action: timer.start
            target:
              entity_id: timer.manual_on_detection_workroom_settle
            data:
              duration: '00:00:10'
        - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id == 'switch.bathroomswitchrouter' and is_state('input_boolean.manual_on_detection_bathroom_armed', 'off') and is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('switch.bathroomswitchrouter') not in ['unknown', 'unavailable'] }}"
          sequence:
          - action: timer.start
            target:
              entity_id: timer.manual_on_detection_bathroom_settle
            data:
              duration: '00:00:10'
    - conditions:
      - condition: trigger
        id: settle_finished
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.entity_id == 'timer.manual_on_detection_hall_entrance_settle' }}"
          - condition: template
            value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('light.hallbulb1') not in ['unknown', 'unavailable'] and states('light.hallbulb2') not in ['unknown', 'unavailable'] and as_timestamp(states.light.hallbulb1.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) and as_timestamp(states.light.hallbulb2.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.manual_on_detection_hall_entrance_armed
        - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.entity_id == 'timer.manual_on_detection_hall_main_settle' }}"
          - condition: template
            value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('light.hallbulb3') not in ['unknown', 'unavailable'] and as_timestamp(states.light.hallbulb3.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.manual_on_detection_hall_main_armed
        - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.entity_id == 'timer.manual_on_detection_livingroom_settle' }}"
          - condition: template
            value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('light.lr_kitchen_table_bulbs') not in ['unknown', 'unavailable'] and states('light.livingroomlineardimmer') not in ['unknown', 'unavailable'] and as_timestamp(states.light.lr_kitchen_table_bulbs.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) and as_timestamp(states.light.livingroomlineardimmer.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.manual_on_detection_livingroom_armed
        - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.entity_id == 'timer.manual_on_detection_workroom_settle' }}"
          - condition: template
            value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('light.workroomledmaindimmer') not in ['unknown', 'unavailable'] and as_timestamp(states.light.workroomledmaindimmer.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.manual_on_detection_workroom_armed
        - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.entity_id == 'timer.manual_on_detection_bathroom_settle' }}"
          - condition: template
            value_template: "{{ is_state('input_boolean.manual_on_detection_backend_ready', 'on') and states('switch.bathroomswitchrouter') not in ['unknown', 'unavailable'] and as_timestamp(states.switch.bathroomswitchrouter.last_reported, 0) >= as_timestamp(states('input_datetime.manual_on_detection_bootstrap_started_at'), 0) }}"
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.manual_on_detection_bathroom_armed
  mode: parallel
  max: 10
- id: hall_entrance_manual_on_detector
  alias: Hall Entrance - Manual On Detector
  description: Detects a manual entrance-light turn-on after startup synchronization has settled.
  triggers:
  - trigger: state
    entity_id:
    - light.hallbulb1
    - light.hallbulb2
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.manual_on_detection_hall_entrance_armed
    state: 'on'
  - condition: state
    entity_id: input_boolean.hall_entrance_auto_on_flag
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hall_entrance_manual_on_flag
  mode: single
- id: '1772371299481'
  alias: A2a - Hall Main - Turn ON
  description: "Sensors: HallPIRSensorMain (occupancy) → MQTT,\n         HallPIRSensorBedroomAdvanced (ZG-204ZM: presence + motion_state + illuminance) → MQTT.\nDark check: (sunset/sunrise window) OR (illuminance\
    \ below threshold). Cooldown: skips auto-on if manually turned off within cooldown. Color temp managed by hourly automation. Waits for light state confirmation before clearing auto_on_flag."
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/HallPIRSensorMain
    value_template: '{{ value_json.get(''occupancy'', '''') | string | lower }}'
    payload: 'true'
  - trigger: mqtt
    topic: zigbee2mqtt/HallPIRSensorBedroomAdvanced
    value_template: "{{ value_json.get('presence', false) == true\n   or value_json.get('motion_state', 'none') in ['large', 'small'] }}"
    payload: 'True'
  conditions:
  - condition: state
    entity_id: input_boolean.shutdown_in_progress
    state: 'off'
  - condition: template
    alias: Skip if light already on (deduplication guard)
    value_template: '{{ not is_state(''light.hallbulb3'', ''on'') }}'
  - condition: template
    value_template: "{% set lux_now = states('sensor.hallpirsensorbedroomadvanced_illuminance') | float(-1) %} {% set lux_threshold = states('input_number.hall_illuminance_threshold_lux') | float(100) %}\
      \ {% set lux_dark = lux_now >= 0 and lux_now < lux_threshold %}\n{% set sunset_offset_sec = states('input_number.hall_sunset_offset_min') | float(0) * 60 %} {% set sunrise_offset_sec = states('input_number.hall_sunrise_offset_min')\
      \ | float(0) * 60 %} {% set now_ts = now().timestamp() %} {% set next_rising_ts = as_timestamp(state_attr('sun.sun', 'next_rising')) %} {% set next_setting_ts = as_timestamp(state_attr('sun.sun',\
      \ 'next_setting')) %} {% set is_night = next_rising_ts < next_setting_ts %} {% if is_night %}\n  {% set last_sunset_ts = next_setting_ts - 86400 %}\n  {% set past_sunset = now_ts >= (last_sunset_ts\
      \ + sunset_offset_sec) %}\n  {% set before_sunrise = now_ts < (next_rising_ts + sunrise_offset_sec) %}\n  {% set time_dark = past_sunset and before_sunrise %}\n{% else %}\n  {% set last_rising_ts\
      \ = next_rising_ts - 86400 %}\n  {% set in_post_sunrise = sunrise_offset_sec > 0 and now_ts < (last_rising_ts + sunrise_offset_sec) %}\n  {% set in_pre_sunset = sunset_offset_sec < 0 and now_ts >=\
      \ (next_setting_ts + sunset_offset_sec) %}\n  {% set time_dark = in_post_sunrise or in_pre_sunset %}\n{% endif %}\n{{ time_dark or lux_dark }}"
  - condition: state
    entity_id: timer.hall_main_manual_off_cooldown
    state: idle
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hall_main_auto_on_flag
  - action: light.turn_on
    target:
      entity_id: light.hallbulb3
    data:
      transition: 1
  - wait_template: '{{ is_state(''light.hallbulb3'', ''on'') }}'
    timeout:
      seconds: 5
  - if:
    - condition: template
      value_template: '{% set cur = state_attr(''light.hallbulb3'', ''brightness'') | int(0) %} {% set min_255 = (states(''input_number.hall_bulbs_min_brightness_pct'') | float(50) / 100 * 255) | int %}
        {{ cur < min_255 }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.hallbulb3
      data:
        brightness_pct: '{{ states(''input_number.hall_bulbs_min_brightness_pct'') | int(50) }}'
  - wait_template: '{{ is_state(''light.hallbulb3'', ''on'') }}'
    timeout:
      seconds: 60
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hall_main_auto_on_flag
  mode: queued
  max: 2
- id: hall_main_auto_off_timer
  alias: Hall Main - Auto-Off Countdown
  description: Starts the visible countdown using the existing automatic or manual timeout. Motion cancels it; the timer is the single source of the normal turn-off deadline.
  triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: template
    value_template: "{{ is_state('binary_sensor.hallpirsensormain_occupancy', 'off')\n   and is_state('binary_sensor.hallpirsensorbedroomadvanced_presence', 'off')\n   and is_state('sensor.hallpirsensorbedroomadvanced_motion_state',\
      \ 'none') }}"
    id: clear
  - trigger: template
    value_template: "{{ not (is_state('binary_sensor.hallpirsensormain_occupancy', 'off')\n   and is_state('binary_sensor.hallpirsensorbedroomadvanced_presence', 'off')\n   and is_state('sensor.hallpirsensorbedroomadvanced_motion_state',\
      \ 'none')) }}"
    id: occupied
  - trigger: state
    entity_id: light.hallbulb3
    to: 'on'
    id: light_on
  - trigger: state
    entity_id: light.hallbulb3
    to: 'off'
    id: light_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: occupied
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.hall_main_auto_off
    - conditions:
      - condition: trigger
        id: light_off
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.hall_main_auto_off
    - conditions:
      - condition: state
        entity_id: light.hallbulb3
        state: 'on'
      - condition: template
        value_template: "{{ is_state('binary_sensor.hallpirsensormain_occupancy', 'off')\n   and is_state('binary_sensor.hallpirsensorbedroomadvanced_presence', 'off')\n   and is_state('sensor.hallpirsensorbedroomadvanced_motion_state',\
          \ 'none') }}"
      - condition: template
        value_template: '{{ not (trigger.id == ''startup'' and is_state(''timer.hall_main_auto_off'', ''active'')) }}'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.hall_main_auto_off
        data:
          duration:
            minutes: "{{ states('input_number.hall_light_timeout_min') | float(1)\n   if trigger.id == 'startup'\n   else states('input_number.hall_light_manual_timeout_min') | float(30)\n   if is_state('input_boolean.hall_main_manual_on_flag',\
              \ 'on')\n   else states('input_number.hall_light_timeout_min') | float(1) }}"
  mode: restart
- id: '1772372224360'
  alias: A2b - Hall Main - Turn OFF
  description: Turns off when the visible Hall Main countdown finishes. The existing zombie failsafe still turns it off if either sensor stays ON for its configured timeout. Auto-off flag is held until
    light state confirms off.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.hall_main_auto_off
  - trigger: state
    entity_id: binary_sensor.hallpirsensormain_occupancy
    to: 'on'
    for:
      minutes: '{{ states(''input_number.hall_light_zombie_timeout_min'') | float(30) }}'
  - trigger: state
    entity_id: binary_sensor.hallpirsensorbedroomadvanced_presence
    to: 'on'
    for:
      minutes: '{{ states(''input_number.hall_light_zombie_timeout_min'') | float(30) }}'
  conditions:
  - condition: template
    value_template: '{{ is_state(''light.hallbulb3'', ''on'') }}'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hall_main_auto_off_flag
  - action: light.turn_off
    target:
      entity_id: light.hallbulb3
    data:
      transition: 2
  - wait_template: '{{ is_state(''light.hallbulb3'', ''off'') }}'
    timeout:
      seconds: 10
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hall_main_auto_off_flag
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hall_main_manual_on_flag
  mode: single
- id: hall_main_manual_on_detector
  alias: Hall Main - Manual On Detector
  description: Detects when hallbulb3 is turned on manually after startup synchronization has settled.
  triggers:
  - trigger: state
    entity_id: light.hallbulb3
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.manual_on_detection_hall_main_armed
    state: 'on'
  - condition: state
    entity_id: input_boolean.hall_main_auto_on_flag
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hall_main_manual_on_flag
  mode: single
- id: '1772375826834'
  alias: LR1 - Living Room - Turn ON
  description: 'Sensors LivingRoomPIRSensorVertical MQTT (presence), LivingRoomPIREntrance MQTT (occupancy). Dark check: max illuminance across available sensors below threshold OR sunset/sunrise timing
    — either condition is sufficient. If at least one sensor reads above threshold, lux check fails regardless of trigger source. Skip if other lights already on. Cooldown skips auto-on if manually turned
    off within cooldown. Waits for light state confirmation before clearing auto_on_flag.

    '
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/LivingRoomPIRSensorVertical
    value_template: '{{ value_json.get(''presence'') | string | lower }}'
    payload: 'true'
  - trigger: mqtt
    topic: zigbee2mqtt/LivingRoomPIREntrance
    value_template: '{{ value_json.get(''occupancy'') | string | lower }}'
    payload: 'true'
  conditions:
  - condition: state
    entity_id: input_boolean.shutdown_in_progress
    state: 'off'
  - condition: template
    alias: Skip if lights already on (deduplication guard)
    value_template: "{{ not is_state('light.lr_kitchen_table_bulbs', 'on') and\n   not is_state('light.livingroomlineardimmer', 'on') }}\n"
  - condition: template
    alias: Dark check — max of available sensors below threshold OR timing window
    value_template: "{# --- Illuminance: max of available sensors only --- #} {% set vertical_available = has_value('sensor.livingroompirsensorvertical_illuminance') %} {% set entrance_available = has_value('sensor.livingroompirentrance_illuminance')\
      \ %} {% set vertical_lux = states('sensor.livingroompirsensorvertical_illuminance') | float(0) %} {% set entrance_lux = states('sensor.livingroompirentrance_illuminance') | float(0) %}\n{# Build list\
      \ of available readings only — unavailable sensors excluded entirely #} {% set available_lux = (\n  ([vertical_lux] if vertical_available else []) +\n  ([entrance_lux] if entrance_available else [])\n\
      ) %} {% set any_available = available_lux | length > 0 %} {% set max_lux = available_lux | max if any_available else 0 %} {% set threshold = states('input_number.livingroom_entrance_illuminance_threshold_lux')\
      \ | float(50) %} {% set combined_dark = any_available and max_lux < threshold %}\n{# --- Timing --- #} {% set sunset_offset_sec = states('input_number.livingroom_sunset_offset_min') | float(0) * 60\
      \ %} {% set sunrise_offset_sec = states('input_number.livingroom_sunrise_offset_min') | float(0) * 60 %} {% set now_ts = now().timestamp() %} {% set nextrising_ts = as_timestamp(state_attr('sun.sun',\
      \ 'next_rising')) %} {% set nextsetting_ts = as_timestamp(state_attr('sun.sun', 'next_setting')) %} {% set is_night = nextrising_ts < nextsetting_ts %} {% if is_night %}\n  {% set last_sunset_ts =\
      \ nextsetting_ts - 86400 %}\n  {% set past_sunset = now_ts > last_sunset_ts + sunset_offset_sec %}\n  {% set before_sunrise = now_ts < nextrising_ts + sunrise_offset_sec %}\n  {% set time_dark = past_sunset\
      \ and before_sunrise %}\n{% else %}\n  {% set last_rising_ts = nextrising_ts - 86400 %}\n  {% set in_post_sunrise = sunrise_offset_sec > 0 and now_ts < last_rising_ts + sunrise_offset_sec %}\n  {%\
      \ set in_pre_sunset = sunset_offset_sec < 0 and now_ts >= nextsetting_ts + sunset_offset_sec %}\n  {% set time_dark = in_post_sunrise or in_pre_sunset %}\n{% endif %}\n{# --- Either condition is sufficient\
      \ --- #} {{ combined_dark or time_dark }}\n"
  - condition: template
    value_template: "{{ not is_state('light.livingroomcirclelightdimmer', 'on') and\n   not is_state('light.livingroombulbtableleft', 'on') and\n   not is_state('light.livingroombulbtablemiddle', 'on')\
      \ and\n   not is_state('light.livingroomlineardimmer', 'on') }}\n"
  - condition: state
    entity_id: timer.livingroom_manual_off_cooldown
    state: idle
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.livingroom_auto_on_flag
  - variables:
      bulbs_were_already_on: '{{ is_state(''light.lr_kitchen_table_bulbs'', ''on'') }}'
      linear_should_turn_on: '{{ not is_state(''light.lr_kitchen_table_bulbs'', ''on'') }}'
  - action: light.turn_on
    target:
      entity_id: light.lr_kitchen_table_bulbs
  - if:
    - condition: template
      value_template: '{{ linear_should_turn_on }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.livingroomlineardimmer
  - wait_template: "{{ is_state('light.lr_kitchen_table_bulbs', 'on') and\n   (not linear_should_turn_on or is_state('light.livingroomlineardimmer', 'on')) }}\n"
    timeout:
      seconds: 5
  - if:
    - condition: template
      value_template: '{% set cur = state_attr(''light.livingroomlineardimmer'', ''brightness'') | int(0) %} {% set min255 = (states(''input_number.livingroom_linear_min_brightness_pct'') | float(30) /
        100 * 255) | int %} {{ linear_should_turn_on and is_state(''light.livingroomlineardimmer'', ''on'') and cur < min255 }}

