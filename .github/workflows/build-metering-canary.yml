name: Build BSEED metering canary

# Safe/offline only: this workflow builds and validates artifacts; it has no
# access to the physical device and never authorizes flashing.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/bootstrap-bl0937-pm
    paths:
      - '.github/workflows/build-metering-canary.yml'
      - 'scripts/apply-metering-overlay.py'
      - 'scripts/metering_overlay_guard.py'
      - 'scripts/ota_guard.py'
      - 'metering-source.lock.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPO: https://github.com/HobboRobin/tuya-zigbee-switch-with-metering.git
      SOURCE_COMMIT: 8b8cc4924a353b35880666f7b48f0afbee89eb17
      BOARD: OUTLET_BSEED_PM_TS011F_b28wrpvx
      DEVICE_TYPE: router
      EXPECTED_CONFIG: b28wrpvx;TS011F-BS-PM;LC3;SB5u;RD2;IB4;M;
      CONVERTER_BLOB: 53b7c7bc66df95ca0316a98398f37bcee04a2a23

    steps:
      - name: Checkout exact supervisor head
        uses: actions/checkout@v4
        with:
          # pull_request normally checks out a synthetic merge ref. Firmware
          # provenance must point at the immutable reviewed head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert checkout identity
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "SUPERVISOR_COMMIT=$actual" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-venv yq unzip wget

      - name: Fetch pinned hardware-proven metering source
        run: |
          rm -rf .work/tuya-zigbee-switch-metering
          git clone --filter=blob:none "$SOURCE_REPO" .work/tuya-zigbee-switch-metering
          git -C .work/tuya-zigbee-switch-metering checkout --detach "$SOURCE_COMMIT"
          test "$(git -C .work/tuya-zigbee-switch-metering rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C .work/tuya-zigbee-switch-metering status --porcelain)"

      - name: Restore Telink SDK/toolchain + Python venv cache
        uses: actions/cache@v4
        with:
          path: |
            .work/tuya-zigbee-switch-metering/telink_tools
            .work/tuya-zigbee-switch-metering/.venv
          key: bseed-metering-telink-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ hashFiles('metering-source.lock.json') }}

      - name: Apply minimal NVM-preserving BSEED overlay
        run: |
          mkdir -p artifacts
          python3 scripts/apply-metering-overlay.py \
            --source .work/tuya-zigbee-switch-metering \
            --apply \
            --json-out artifacts/overlay.json
          python3 scripts/apply-metering-overlay.py \
            --source .work/tuya-zigbee-switch-metering \
            --verify \
            --json-out artifacts/overlay-verified.json
          python3 scripts/metering_overlay_guard.py \
            --source .work/tuya-zigbee-switch-metering \
            --json-out artifacts/source-guard.json

          # Coordinator support is intentionally taken from the pinned downstream
          # release, not regenerated from the canary's NVM-preserving config. The
          # pinned converter already knows this model has Electrical Measurement
          # and Smart Energy Metering support.
          test "$(git -C .work/tuya-zigbee-switch-metering hash-object zigbee2mqtt/converters/switch_custom.js)" = "$CONVERTER_BLOB"
          cp .work/tuya-zigbee-switch-metering/zigbee2mqtt/converters/switch_custom.js \
             artifacts/switch_custom.js

      - name: Install only Telink toolchain and Python environment
        working-directory: .work/tuya-zigbee-switch-metering
        run: |
          make telink/tools/all
          if [ ! -x .venv/bin/python ]; then
            make setup_venv
          fi
          .venv/bin/python -m pip install -r requirements.txt
          make telink/tools/verify

      - name: Run downstream firmware tests
        working-directory: .work/tuya-zigbee-switch-metering
        run: make tests PYTHON=.venv/bin/python

      - name: Recheck exact source overlay after setup/tests
        run: |
          python3 scripts/metering_overlay_guard.py \
            --source .work/tuya-zigbee-switch-metering \
            --json-out artifacts/source-guard-post-tests.json

      - name: Build only the BSEED b28wrpvx router
        working-directory: .work/tuya-zigbee-switch-metering
        run: |
          BOARD="$BOARD" DEVICE_TYPE="$DEVICE_TYPE" make board/build
          ls -lah "bin/router/$BOARD"

      - name: Select and validate custom-to-custom OTA artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t normal < <(find ".work/tuya-zigbee-switch-metering/bin/router/$BOARD" \
            -maxdepth 1 -type f -name '*.zigbee' ! -name '*from_tuya*' ! -name '*forced*' | sort)
          mapfile -t forced < <(find ".work/tuya-zigbee-switch-metering/bin/router/$BOARD" \
            -maxdepth 1 -type f -name '*forced.zigbee' | sort)
          if [ "${#normal[@]}" -ne 1 ] || [ "${#forced[@]}" -ne 1 ]; then
            echo "Expected exactly one normal and one forced custom-to-custom image." >&2
            printf 'normal(%s): %s\n' "${#normal[@]}" "${normal[*]-}" >&2
            printf 'forced(%s): %s\n' "${#forced[@]}" "${forced[*]-}" >&2
            exit 1
          fi

          cp "${normal[0]}" artifacts/bseed-b28wrpvx-metering-canary.zigbee
          cp "${forced[0]}" artifacts/bseed-b28wrpvx-metering-canary-forced.zigbee

          python3 scripts/ota_guard.py inspect \
            artifacts/bseed-b28wrpvx-metering-canary.zigbee \
            --required-ascii "$EXPECTED_CONFIG" \
            --json-out artifacts/ota-inspect.json
          python3 scripts/ota_guard.py inspect \
            artifacts/bseed-b28wrpvx-metering-canary-forced.zigbee \
            --required-ascii "$EXPECTED_CONFIG" \
            --json-out artifacts/ota-inspect-forced.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          normal = json.loads(Path('artifacts/ota-inspect.json').read_text())
          forced = json.loads(Path('artifacts/ota-inspect-forced.json').read_text())
          for label, p in [('normal', normal), ('forced', forced)]:
              h, t = p['header'], p['telink']
              assert h['manufacturer_code'] == 4417, (label, h)
              assert h['image_type'] == 43556, (label, h)
              assert t['required_ascii_occurrences'] == 1, (label, t)
              assert t['payload_size'] <= 0x40000, (label, t)
          assert normal['header']['file_version'] != 0xFFFFFFFF, normal['header']
          assert forced['header']['file_version'] == 0xFFFFFFFF, forced['header']
          assert normal['telink']['inner_file_version'] == forced['telink']['inner_file_version']
          print('OTA_IDENTITY_PASS manufacturer=4417 image_type=43556 normal+forced')
          PY

          sha256sum artifacts/*.zigbee artifacts/switch_custom.js | sort | tee artifacts/SHA256SUMS
          sha512sum artifacts/*.zigbee artifacts/switch_custom.js | sort | tee artifacts/SHA512SUMS

      - name: Record immutable build provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          normal_path = Path('artifacts/bseed-b28wrpvx-metering-canary.zigbee')
          forced_path = Path('artifacts/bseed-b28wrpvx-metering-canary-forced.zigbee')
          normal = json.loads(Path('artifacts/ota-inspect.json').read_text())
          forced = json.loads(Path('artifacts/ota-inspect-forced.json').read_text())
          provenance = {
              'schema': 3,
              'supervisor_commit': os.environ['SUPERVISOR_COMMIT'],
              'metering_source_repo': 'HobboRobin/tuya-zigbee-switch-with-metering',
              'metering_source_commit': '8b8cc4924a353b35880666f7b48f0afbee89eb17',
              'overlay_script_sha256': sha256('scripts/apply-metering-overlay.py'),
              'overlay_guard_sha256': sha256('scripts/metering_overlay_guard.py'),
              'source_guard_sha256': sha256('artifacts/source-guard.json'),
              'source_guard_post_tests_sha256': sha256('artifacts/source-guard-post-tests.json'),
              'z2m_converter_git_blob': '53b7c7bc66df95ca0316a98398f37bcee04a2a23',
              'z2m_converter_sha256': sha256('artifacts/switch_custom.js'),
              'board': 'OUTLET_BSEED_PM_TS011F_b28wrpvx',
              'device_type': 'router',
              'preserved_device_config': 'b28wrpvx;TS011F-BS-PM;LC3;SB5u;RD2;IB4;M;',
              'meter_gpio': {'cf': 'PA1', 'cf1': 'PC2', 'sel': 'PB1'},
              'nvm_device_config_write_required': False,
              'overload_relay_actuation': False,
              'candidate_normal': {
                  'file_name': normal_path.name,
                  'sha256': sha256(normal_path),
                  'file_version': normal['header']['file_version'],
                  'inner_file_version': normal['telink']['inner_file_version'],
                  'payload_size': normal['telink']['payload_size'],
              },
              'candidate_forced': {
                  'file_name': forced_path.name,
                  'sha256': sha256(forced_path),
                  'file_version': forced['header']['file_version'],
                  'inner_file_version': forced['telink']['inner_file_version'],
                  'payload_size': forced['telink']['payload_size'],
              },
              'flash_authorized': False,
          }
          Path('artifacts/build-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY

      - name: Upload canary build evidence
        uses: actions/upload-artifact@v4
        with:
          name: bseed-b28wrpvx-metering-canary-${{ env.SUPERVISOR_COMMIT }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
