name: Build BSEED metering canary

# Safe/offline only: this workflow builds and validates artifacts; it has no
# access to the physical device and never authorizes flashing.
on:
  workflow_dispatch:
    inputs:
      protection_enabled:
        description: "Build the separately gated overload-to-relay descendant"
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - agent/bootstrap-bl0937-pm
    paths:
      - '.github/workflows/build-metering-canary.yml'
      - 'scripts/apply-metering-overlay.py'
      - 'scripts/metering_overlay_guard.py'
      - 'scripts/metering_candidate_gate.py'
      - 'scripts/new-metering-candidate.ps1'
      - 'scripts/class_a_gate.py'
      - 'scripts/confirmation_preflash_gate.py'
      - 'scripts/preflash_gate.py'
      - 'scripts/ota_guard.py'
      - 'scripts/patch-calibration-converter.py'
      - 'metering-source.lock.json'
      - 'templates/metering-candidate-manifest.json'
      - 'templates/class-a-functional-evidence.json'
      - 'templates/confirmation-preflash.json'
      - 'policy/CLASS_A_CLOSURE.md'
      - 'tests/test_metering_candidate_gate.py'
      - 'tests/test_functional_class_a_path.py'
      - 'tests/test_calibration_converter.py'
      - 'README.md'
      - 'PROJECT_STATUS.md'
      - 'DECISIONS.md'

permissions:
  contents: read

concurrency:
  group: bseed-metering-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPO: https://github.com/HobboRobin/tuya-zigbee-switch-with-metering.git
      SOURCE_COMMIT: 8b8cc4924a353b35880666f7b48f0afbee89eb17
      BOARD: OUTLET_BSEED_PM_TS011F_b28wrpvx
      DEVICE_TYPE: router
      EXPECTED_CONFIG: b28wrpvx;TS011F-BS-PM;LC3;SB5u;RD2;IB4;M;
      CONVERTER_SOURCE_BLOB: 53b7c7bc66df95ca0316a98398f37bcee04a2a23
      CONVERTER_BLOB: c8d03d1fa2d5ef125e720a7878908a4f5a63992e
      PROTECTION_ENABLED: ${{ inputs.protection_enabled && 'true' || 'false' }}

    steps:
      - name: Checkout exact supervisor head
        uses: actions/checkout@v4
        with:
          # pull_request normally checks out a synthetic merge ref. Firmware
          # provenance must point at the immutable reviewed head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert checkout identity
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "SUPERVISOR_COMMIT=$actual" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-venv yq unzip wget

      - name: Fetch pinned hardware-proven metering source
        run: |
          rm -rf .work/tuya-zigbee-switch-metering
          git clone --filter=blob:none "$SOURCE_REPO" .work/tuya-zigbee-switch-metering
          git -C .work/tuya-zigbee-switch-metering checkout --detach "$SOURCE_COMMIT"
          test "$(git -C .work/tuya-zigbee-switch-metering rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C .work/tuya-zigbee-switch-metering status --porcelain)"

      - name: Restore Telink SDK/toolchain + Python venv cache
        uses: actions/cache@v4
        with:
          path: |
            .work/tuya-zigbee-switch-metering/telink_tools
            .work/tuya-zigbee-switch-metering/.venv
          key: bseed-metering-telink-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ hashFiles('metering-source.lock.json') }}

      - name: Run unchanged downstream firmware tests
        working-directory: .work/tuya-zigbee-switch-metering
        run: |
          # The upstream config/calibration tests describe the unmodified
          # source. PR6 deliberately changes the compiled BSEED config to the
          # NVM-preserving form without an EP/EB token, so run those tests
          # before applying the reviewed overlay.
          if [ ! -x .venv/bin/python ]; then
            make setup_venv
          fi
          .venv/bin/python -m pip install -r requirements.txt
          make tests PYTHON=.venv/bin/python

      - name: Apply minimal NVM-preserving BSEED overlay
        run: |
          mkdir -p artifacts
          overlay_mode=()
          if [[ "$PROTECTION_ENABLED" == "true" ]]; then
            overlay_mode+=(--enable-overload-relay)
          fi
          python3 scripts/apply-metering-overlay.py \
            --source .work/tuya-zigbee-switch-metering \
            --apply \
            "${overlay_mode[@]}" \
            --json-out artifacts/overlay.json
          python3 scripts/apply-metering-overlay.py \
            --source .work/tuya-zigbee-switch-metering \
            --verify \
            "${overlay_mode[@]}" \
            --json-out artifacts/overlay-verified.json
          python3 scripts/metering_overlay_guard.py \
            --source .work/tuya-zigbee-switch-metering \
            "${overlay_mode[@]}" \
            --json-out artifacts/source-guard.json

          python3 -m unittest tests.test_metering_overlay tests.test_metering_candidate_gate
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          enabled = os.environ['PROTECTION_ENABLED'] == 'true'
          Path('artifacts/protection-tests.json').write_text(json.dumps({
              'status': 'PASS',
              'mode': 'overload_relay_actuation' if enabled else 'metering_baseline',
              'deterministic_checks': [
                  'soft_trip_action_and_power_alarm',
                  'settings_snapshot_restore_contract',
                  'final_relay_off_contract',
                  'no_load_suppression_interaction',
              ] if enabled else [],
          }, indent=2) + '\n')
          PY

          # Coordinator support is intentionally taken from the pinned downstream
          # release, not regenerated from the canary's NVM-preserving config. The
          # pinned converter already knows this model has Electrical Measurement
          # and Smart Energy Metering support.
          cp .work/tuya-zigbee-switch-metering/zigbee2mqtt/converters/switch_custom.js \
             artifacts/switch_custom.js
          test "$(git -C .work/tuya-zigbee-switch-metering hash-object zigbee2mqtt/converters/switch_custom.js)" = "$CONVERTER_SOURCE_BLOB"
          python3 scripts/patch-calibration-converter.py artifacts/switch_custom.js \
            --in-place --enable-power-get
          python3 -m unittest tests.test_calibration_converter
          test "$(git hash-object artifacts/switch_custom.js)" = "$CONVERTER_BLOB"

      - name: Install only Telink toolchain and Python environment
        working-directory: .work/tuya-zigbee-switch-metering
        run: |
          make telink/tools/all
          if [ ! -x .venv/bin/python ]; then
            make setup_venv
          fi
          .venv/bin/python -m pip install -r requirements.txt
          make telink/tools/verify

      - name: Recheck exact source overlay after setup
        run: |
          overlay_mode=()
          if [[ "$PROTECTION_ENABLED" == "true" ]]; then
            overlay_mode+=(--enable-overload-relay)
          fi
          python3 scripts/metering_overlay_guard.py \
            --source .work/tuya-zigbee-switch-metering \
            "${overlay_mode[@]}" \
            --json-out artifacts/source-guard-post-tests.json

      - name: Build only the BSEED b28wrpvx router
        working-directory: .work/tuya-zigbee-switch-metering
        run: |
          BOARD="$BOARD" DEVICE_TYPE="$DEVICE_TYPE" make board/build
          ls -lah "bin/router/$BOARD"

      - name: Select and validate all OTA artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t normal < <(find ".work/tuya-zigbee-switch-metering/bin/router/$BOARD" \
            -maxdepth 1 -type f -name '*.zigbee' ! -name '*from_tuya*' ! -name '*forced*' | sort)
          mapfile -t forced < <(find ".work/tuya-zigbee-switch-metering/bin/router/$BOARD" \
            -maxdepth 1 -type f -name '*forced.zigbee' | sort)
          mapfile -t from_tuya < <(find ".work/tuya-zigbee-switch-metering/bin/router/$BOARD" \
            -maxdepth 1 -type f -name '*from_tuya.zigbee' | sort)
          if [ "${#normal[@]}" -ne 1 ] || [ "${#forced[@]}" -ne 1 ] || [ "${#from_tuya[@]}" -ne 1 ]; then
            echo "Expected exactly one normal, forced, and from_tuya image." >&2
            printf 'normal(%s): %s\n' "${#normal[@]}" "${normal[*]-}" >&2
            printf 'forced(%s): %s\n' "${#forced[@]}" "${forced[*]-}" >&2
            printf 'from_tuya(%s): %s\n' "${#from_tuya[@]}" "${from_tuya[*]-}" >&2
            exit 1
          fi

          cp "${normal[0]}" artifacts/bseed-b28wrpvx-metering-canary.zigbee
          cp "${forced[0]}" artifacts/bseed-b28wrpvx-metering-canary-forced.zigbee
          cp "${from_tuya[0]}" artifacts/bseed-b28wrpvx-metering-canary-from_tuya.zigbee

          python3 scripts/ota_guard.py inspect \
            artifacts/bseed-b28wrpvx-metering-canary.zigbee \
            --required-ascii "$EXPECTED_CONFIG" \
            --json-out artifacts/ota-inspect.json
          python3 scripts/ota_guard.py inspect \
            artifacts/bseed-b28wrpvx-metering-canary-forced.zigbee \
            --required-ascii "$EXPECTED_CONFIG" \
            --json-out artifacts/ota-inspect-forced.json
          python3 scripts/ota_guard.py inspect \
            artifacts/bseed-b28wrpvx-metering-canary-from_tuya.zigbee \
            --required-ascii "$EXPECTED_CONFIG" \
            --json-out artifacts/ota-inspect-from_tuya.json

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          normal = json.loads(Path('artifacts/ota-inspect.json').read_text())
          forced = json.loads(Path('artifacts/ota-inspect-forced.json').read_text())
          from_tuya = json.loads(Path('artifacts/ota-inspect-from_tuya.json').read_text())
          for label, p in [('normal', normal), ('forced', forced), ('from_tuya', from_tuya)]:
              h, t = p['header'], p['telink']
              assert h['manufacturer_code'] == 4417, (label, h)
              expected_image_type = 54179 if label == 'from_tuya' else 43556
              assert h['image_type'] == expected_image_type, (label, h)
              assert t['required_ascii_occurrences'] == 1, (label, t)
              assert t['payload_size'] <= 0x40000, (label, t)
          assert normal['header']['file_version'] != 0xFFFFFFFF, normal['header']
          assert forced['header']['file_version'] == 0xFFFFFFFF, forced['header']
          assert from_tuya['header']['file_version'] == 0xFFFFFFFF, from_tuya['header']
          assert normal['telink']['inner_file_version'] == forced['telink']['inner_file_version']
          assert normal['telink']['inner_file_version'] == from_tuya['telink']['inner_file_version']

          def payload(path, inspected):
              data = Path(path).read_bytes()
              start = inspected['header']['header_length'] + 6
              end = start + inspected['telink']['payload_size']
              return data[start:end]

          payloads = {
              'normal': payload('artifacts/bseed-b28wrpvx-metering-canary.zigbee', normal),
              'forced': payload('artifacts/bseed-b28wrpvx-metering-canary-forced.zigbee', forced),
              'from_tuya': payload('artifacts/bseed-b28wrpvx-metering-canary-from_tuya.zigbee', from_tuya),
          }
          hashes = {label: hashlib.sha256(data).hexdigest() for label, data in payloads.items()}
          assert len(set(payloads.values())) == 1, hashes
          Path('artifacts/ota-payload-identity.json').write_text(json.dumps({
              'status': 'PASS',
              'payload_sha256': hashes['normal'],
              'payload_size': len(payloads['normal']),
              'wrappers': hashes,
              'identities': {
                  'normal': [4417, 43556, normal['header']['file_version']],
                  'forced': [4417, 43556, forced['header']['file_version']],
                  'from_tuya': [4417, 54179, from_tuya['header']['file_version']],
              },
          }, indent=2) + '\n')
          print('OTA_IDENTITY_PASS normal=4417/43556 forced=4417/43556 from_tuya=4417/54179')
          print('OTA_PAYLOAD_IDENTITY_PASS sha256=' + hashes['normal'])
          PY

          sha256sum artifacts/*.zigbee artifacts/switch_custom.js | sort | tee artifacts/SHA256SUMS
          sha512sum artifacts/*.zigbee artifacts/switch_custom.js | sort | tee artifacts/SHA512SUMS

      - name: Record immutable build provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          normal_path = Path('artifacts/bseed-b28wrpvx-metering-canary.zigbee')
          forced_path = Path('artifacts/bseed-b28wrpvx-metering-canary-forced.zigbee')
          from_tuya_path = Path('artifacts/bseed-b28wrpvx-metering-canary-from_tuya.zigbee')
          normal = json.loads(Path('artifacts/ota-inspect.json').read_text())
          forced = json.loads(Path('artifacts/ota-inspect-forced.json').read_text())
          from_tuya = json.loads(Path('artifacts/ota-inspect-from_tuya.json').read_text())
          payload_identity = json.loads(Path('artifacts/ota-payload-identity.json').read_text())
          provenance = {
              'schema': 3,
              'supervisor_commit': os.environ['SUPERVISOR_COMMIT'],
              'metering_source_repo': 'HobboRobin/tuya-zigbee-switch-with-metering',
              'metering_source_commit': '8b8cc4924a353b35880666f7b48f0afbee89eb17',
              'overlay_script_sha256': sha256('scripts/apply-metering-overlay.py'),
              'overlay_guard_sha256': sha256('scripts/metering_overlay_guard.py'),
              'source_guard_sha256': sha256('artifacts/source-guard.json'),
              'source_guard_post_tests_sha256': sha256('artifacts/source-guard-post-tests.json'),
              'z2m_converter_source_git_blob': '53b7c7bc66df95ca0316a98398f37bcee04a2a23',
              'z2m_converter_git_blob': 'c8d03d1fa2d5ef125e720a7878908a4f5a63992e',
              'z2m_converter_sha256': sha256('artifacts/switch_custom.js'),
              'board': 'OUTLET_BSEED_PM_TS011F_b28wrpvx',
              'device_type': 'router',
              'preserved_device_config': 'b28wrpvx;TS011F-BS-PM;LC3;SB5u;RD2;IB4;M;',
              'meter_gpio': {'cf': 'PA1', 'cf1': 'PC2', 'sel': 'PB1'},
              'nvm_device_config_write_required': False,
              'overload_relay_actuation': os.environ['PROTECTION_ENABLED'] == 'true',
              'protection_test_report': 'artifacts/protection-tests.json',
              'candidate_normal': {
                  'file_name': normal_path.name,
                  'sha256': sha256(normal_path),
                  'file_version': normal['header']['file_version'],
                  'inner_file_version': normal['telink']['inner_file_version'],
                  'payload_size': normal['telink']['payload_size'],
              },
              'candidate_forced': {
                  'file_name': forced_path.name,
                  'sha256': sha256(forced_path),
                  'file_version': forced['header']['file_version'],
                  'inner_file_version': forced['telink']['inner_file_version'],
                  'payload_size': forced['telink']['payload_size'],
              },
              'candidate_from_tuya': {
                  'file_name': from_tuya_path.name,
                  'sha256': sha256(from_tuya_path),
                  'file_version': from_tuya['header']['file_version'],
                  'inner_file_version': from_tuya['telink']['inner_file_version'],
                  'image_type': from_tuya['header']['image_type'],
                  'payload_size': from_tuya['telink']['payload_size'],
                  'payload_sha256': payload_identity['payload_sha256'],
              },
              'ota_payload_identity': payload_identity,
              'flash_authorized': False,
          }
          Path('artifacts/build-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY

      - name: Upload canary build evidence
        uses: actions/upload-artifact@v4
        with:
          name: bseed-b28wrpvx-metering-canary-${{ env.SUPERVISOR_COMMIT }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
