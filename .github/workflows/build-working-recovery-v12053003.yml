name: Build working PM recovery v12053003

# OFFLINE ONLY. Rebuild the hardware-proven protection firmware from the exact
# historical pipeline, first replaying v0x12053000 byte-for-byte, then building
# the identical source/config as the newer v0x12053003 recovery image.
on:
  push:
    branches:
      - supervisor/recovery-8b8cc492-v12053003
    paths:
      - '.github/workflows/build-working-recovery-v12053003.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bseed-working-recovery-v12053003-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_REPO: https://github.com/HobboRobin/tuya-zigbee-switch-with-metering.git
      SOURCE_COMMIT: 8b8cc4924a353b35880666f7b48f0afbee89eb17
      BOARD: OUTLET_BSEED_PM_TS011F_b28wrpvx
      DEVICE_TYPE: router
      EXPECTED_CONFIG: b28wrpvx;TS011F-BS-PM;LC3;SB5u;RD2;IB4;M;
      BASELINE_VERSION: '0x12053000'
      RECOVERY_VERSION: '0x12053003'
      BASELINE_FORCED_SHA256: 02fe4b9f75c6b48b17de913c1aa5a5d1550d622399376c1a38c54d984ea7e4d7
      BASELINE_FORCED_PATH: artifacts/protection-cb45507-0178a1d/bseed-b28wrpvx-protection-canary-forced.zigbee
      CONVERTER_BLOB: 53b7c7bc66df95ca0316a98398f37bcee04a2a23

    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert immutable historical baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -f "$BASELINE_FORCED_PATH"
          actual="$(sha256sum "$BASELINE_FORCED_PATH" | awk '{print $1}')"
          test "$actual" = "$BASELINE_FORCED_SHA256"
          echo "SUPERVISOR_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-venv yq unzip wget

      - name: Fetch exact working firmware source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .work/tuya-zigbee-switch-metering
          git clone --filter=blob:none "$SOURCE_REPO" .work/tuya-zigbee-switch-metering
          git -C .work/tuya-zigbee-switch-metering checkout --detach "$SOURCE_COMMIT"
          test "$(git -C .work/tuya-zigbee-switch-metering rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C .work/tuya-zigbee-switch-metering status --porcelain)"

      - name: Restore pinned Telink SDK/toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            .work/tuya-zigbee-switch-metering/telink_tools
            .work/tuya-zigbee-switch-metering/.venv
          key: bseed-working-recovery-${{ runner.os }}-${{ env.SOURCE_COMMIT }}-${{ hashFiles('metering-source.lock.json') }}

      - name: Run unchanged downstream tests
        working-directory: .work/tuya-zigbee-switch-metering
        run: |
          if [ ! -x .venv/bin/python ]; then
            make setup_venv
          fi
          .venv/bin/python -m pip install -r requirements.txt
          make tests PYTHON=.venv/bin/python

      - name: Apply the exact hardware-proven protection overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          python3 scripts/apply-metering-overlay.py \
            --source .work/tuya-zigbee-switch-metering \
            --apply --enable-overload-relay \
            --json-out build-evidence/overlay.json
          python3 scripts/apply-metering-overlay.py \
            --source .work/tuya-zigbee-switch-metering \
            --verify --enable-overload-relay \
            --json-out build-evidence/overlay-verified.json
          python3 scripts/metering_overlay_guard.py \
            --source .work/tuya-zigbee-switch-metering \
            --enable-overload-relay \
            --json-out build-evidence/source-guard.json
          python3 -m unittest tests.test_metering_overlay tests.test_metering_candidate_gate
          test "$(git -C .work/tuya-zigbee-switch-metering hash-object zigbee2mqtt/converters/switch_custom.js)" = "$CONVERTER_BLOB"

      - name: Install and verify pinned Telink toolchain
        working-directory: .work/tuya-zigbee-switch-metering
        run: |
          make telink/tools/all
          if [ ! -x .venv/bin/python ]; then
            make setup_venv
          fi
          .venv/bin/python -m pip install -r requirements.txt
          make telink/tools/verify

      - name: Replay the exact working v0x12053000 build
        shell: bash
        working-directory: .work/tuya-zigbee-switch-metering
        run: |
          set -euo pipefail
          BOARD="$BOARD" DEVICE_TYPE="$DEVICE_TYPE" FILE_VERSION="$BASELINE_VERSION" make board/build
          out="bin/router/$BOARD"
          forced="$(find "$out" -maxdepth 1 -type f -name '*forced.zigbee' -print -quit)"
          normal="$(find "$out" -maxdepth 1 -type f -name '*.zigbee' ! -name '*forced*' ! -name '*from_tuya*' -print -quit)"
          test -n "$forced" && test -n "$normal"
          mkdir -p ../../../build-evidence/replay
          cp "$forced" ../../../build-evidence/replay/working-v12053000-forced.zigbee
          cp "$normal" ../../../build-evidence/replay/working-v12053000.zigbee

      - name: Require byte-for-byte reproduction of the hardware-proven image
        shell: bash
        run: |
          set -euo pipefail
          replay=build-evidence/replay/working-v12053000-forced.zigbee
          sha="$(sha256sum "$replay" | awk '{print $1}')"
          test "$sha" = "$BASELINE_FORCED_SHA256"
          cmp -s "$replay" "$BASELINE_FORCED_PATH"
          python3 scripts/ota_guard.py inspect "$replay" \
            --required-ascii "$EXPECTED_CONFIG" \
            --json-out build-evidence/replay/ota-inspect.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('build-evidence/replay/ota-inspect.json').read_text())
          assert x['header']['manufacturer_code']==4417
          assert x['header']['image_type']==43556
          assert x['header']['file_version']==0xFFFFFFFF
          assert x['telink']['inner_file_version']==0x12053000
          assert x['telink']['crc_valid'] is True
          assert x['telink']['required_ascii_occurrences']==1
          print('KNOWN_GOOD_REPLAY_PASS')
          PY

      - name: Build the same working firmware as newer v0x12053003
        shell: bash
        working-directory: .work/tuya-zigbee-switch-metering
        run: |
          set -euo pipefail
          BOARD="$BOARD" DEVICE_TYPE="$DEVICE_TYPE" FILE_VERSION="$RECOVERY_VERSION" make board/build
          out="bin/router/$BOARD"
          forced="$(find "$out" -maxdepth 1 -type f -name '*forced.zigbee' -print -quit)"
          normal="$(find "$out" -maxdepth 1 -type f -name '*.zigbee' ! -name '*forced*' ! -name '*from_tuya*' -print -quit)"
          test -n "$forced" && test -n "$normal"
          mkdir -p ../../../build-evidence/recovery
          cp "$forced" ../../../build-evidence/recovery/working-v12053003-forced.zigbee
          cp "$normal" ../../../build-evidence/recovery/working-v12053003.zigbee

      - name: Validate recovery OTA identity, inner version and byte delta
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ota_guard.py inspect build-evidence/recovery/working-v12053003.zigbee \
            --required-ascii "$EXPECTED_CONFIG" \
            --json-out build-evidence/recovery/ota-inspect.json
          python3 scripts/ota_guard.py inspect build-evidence/recovery/working-v12053003-forced.zigbee \
            --required-ascii "$EXPECTED_CONFIG" \
            --json-out build-evidence/recovery/ota-inspect-forced.json
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path

          replay_path=Path('build-evidence/replay/working-v12053000-forced.zigbee')
          recovery_path=Path('build-evidence/recovery/working-v12053003-forced.zigbee')
          replay=replay_path.read_bytes(); recovery=recovery_path.read_bytes()
          assert len(replay)==len(recovery)

          normal=json.loads(Path('build-evidence/recovery/ota-inspect.json').read_text())
          forced=json.loads(Path('build-evidence/recovery/ota-inspect-forced.json').read_text())
          for x in (normal, forced):
              assert x['header']['manufacturer_code']==4417
              assert x['header']['image_type']==43556
              assert x['telink']['inner_file_version']==0x12053003
              assert x['telink']['crc_valid'] is True
              assert x['telink']['required_ascii_occurrences']==1
          assert normal['header']['file_version']==0x12053003
          assert forced['header']['file_version']==0xFFFFFFFF

          header_len=struct.unpack_from('<H', replay, 6)[0]
          payload_start=header_len+6
          expected=set(range(payload_start+2,payload_start+6)) | set(range(len(replay)-4,len(replay)))
          diffs=[i for i,(a,b) in enumerate(zip(replay,recovery)) if a!=b]
          unexpected=[i for i in diffs if i not in expected]
          report={
              'baseline_sha256': hashlib.sha256(replay).hexdigest(),
              'recovery_sha256': hashlib.sha256(recovery).hexdigest(),
              'bytes': len(replay),
              'changed_offsets': diffs,
              'expected_version_offsets': sorted(expected),
              'unexpected_offsets': unexpected,
              'baseline_inner_version': hex(forced['telink']['inner_file_version']-3),
              'recovery_inner_version': hex(forced['telink']['inner_file_version']),
          }
          Path('build-evidence/recovery/byte-diff.json').write_text(json.dumps(report,indent=2)+'\n')
          assert not unexpected, report
          print('RECOVERY_DELTA_PASS changed_offsets=',diffs)
          PY

          sha256sum build-evidence/recovery/*.zigbee | sort | tee build-evidence/recovery/SHA256SUMS
          sha512sum build-evidence/recovery/*.zigbee | sort | tee build-evidence/recovery/SHA512SUMS

      - name: Record immutable recovery provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          out={
            'schema':1,
            'supervisor_commit':os.environ['SUPERVISOR_COMMIT'],
            'source_repo':'HobboRobin/tuya-zigbee-switch-with-metering',
            'source_commit':os.environ['SOURCE_COMMIT'],
            'board':os.environ['BOARD'],
            'device_type':'router',
            'device_config':os.environ['EXPECTED_CONFIG'],
            'protection_enabled':True,
            'baseline_inner_version':'0x12053000',
            'baseline_forced_sha256':os.environ['BASELINE_FORCED_SHA256'],
            'baseline_reproduced_byte_for_byte':True,
            'recovery_inner_version':'0x12053003',
            'recovery_normal_sha256':sha('build-evidence/recovery/working-v12053003.zigbee'),
            'recovery_forced_sha256':sha('build-evidence/recovery/working-v12053003-forced.zigbee'),
            'flash_authorized':False,
          }
          Path('build-evidence/recovery/build-provenance.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Upload immutable recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: bseed-working-pm-recovery-v12053003-${{ env.SUPERVISOR_COMMIT }}
          path: build-evidence/
          if-no-files-found: error
          retention-days: 30
